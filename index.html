<title>Moonlit Vows</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="googlebot" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Parisienne&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Tiro+Devanagari+Sanskrit:ital@0;1&family=Tiro+Bangla:ital@0;1&display=swap">

<style>
/* ============================================================
   MOONLIT VOWS — wedding invitation
   Everything you need to change lives in the CONFIG block
   at the top of the script at the bottom of this file.
   ============================================================ */

:root{
  /* --- ink & ground --------------------------------------- */
  --night:        #101733;
  --night-deep:   #070b1c;
  --night-haze:   #2a2f52;
  --blush:        #f3dcda;
  --blush-soft:   #faede8;
  --cream:        #fdf7f3;
  /* --- type colours --------------------------------------- */
  --oxblood:      #6b211c;
  --oxblood-soft: #8a413a;
  --rose-ink:     #8a5f59;
  --gold:         #d8a441;
  --gold-pale:    #efcb86;
  --ivory:        #f6ece2;
  /* --- structure ------------------------------------------ */
  --line:         rgba(107,33,28,.16);
  --line-soft:    rgba(107,33,28,.09);
  --shade:        rgba(107,33,28,.06);

  --f-name:   'Great Vibes', 'Segoe Script', cursive;
  --f-script: 'Parisienne', 'Great Vibes', cursive;
  --f-serif:  'EB Garamond', Georgia, 'Times New Roman', serif;
  --f-deva:   'Tiro Devanagari Sanskrit', 'Noto Serif Devanagari', Georgia, serif;
  --f-bangla: 'Tiro Bangla', 'Noto Serif Bengali', Georgia, serif;
  /* every script the language switcher can land on, for buttons
     whose label is written in the language they switch TO      */
  --f-any:    'EB Garamond', 'Tiro Devanagari Sanskrit', 'Tiro Bangla',
              'Noto Serif Devanagari', 'Noto Serif Bengali', Georgia, serif;

  --col: 480px;          /* the phone-width content column */
  --pad: clamp(22px, 6.5vw, 34px);
}

*,*::before,*::after{ box-sizing:border-box; }

body{
  margin:0;
  background:
    radial-gradient(120% 80% at 50% 0%, #efd9d7 0%, #e4c8c8 45%, #d8b9bb 100%)
    fixed;
  color:var(--oxblood);
  font-family:var(--f-serif);
  font-size:17px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
body.is-locked{ overflow:hidden; height:100vh; }

img,svg,canvas{ display:block; max-width:100%; }
button{ font:inherit; color:inherit; }

:focus-visible{
  outline:2px solid var(--gold);
  outline-offset:3px;
  border-radius:3px;
}

/* ---------- the column ------------------------------------ */
.site{
  width:min(100%, var(--col));
  margin-inline:auto;
  position:relative;
  background:var(--blush);
  box-shadow:0 0 90px rgba(74,20,24,.28);
  overflow:clip;
}

/* ============================================================
   1 · GATE COVER
   ============================================================ */
/* ------------------------------------------------------------
   The opening sequence. Every step is a CSS transition delay so
   the whole thing stays on one clock; OPEN_MS in the script is
   the only number that has to agree with it.

     0.00s  "tap to open" fades
     0.00s  doors begin their swing (2.2s, right lags 0.09s)
     0.00s  the bow drops away
     0.50s  the cover's backdrop dissolves — from here you are
            watching the doors open onto the real night sky
     1.00s  the Ganesha niche lifts and fades
     2.29s  doors fully open · a beat to look through them
     2.80s  the cover itself fades out (1.1s)
     3.90s  cover removed, page unlocked
   ------------------------------------------------------------ */
.cover{
  position:fixed; inset:0; z-index:70;
  display:grid; place-items:center;
  background-color:var(--night-deep);
  overflow:hidden;
  transition:background-color 1.5s ease .5s,
             opacity 1.1s ease 2.8s,
             visibility 1.1s ease 2.8s;
}
/* letting the ground go transparent is what reveals the hero
   through the widening gap between the doors */
.cover.is-open{
  background-color:transparent;
  opacity:0; visibility:hidden; pointer-events:none;
}

.cover-stage{
  position:relative;
  width:min(100%, var(--col)); height:100%;
  overflow:hidden;
  background:transparent;
  transition:transform 3.9s cubic-bezier(.3,.05,.3,1);
}
/* a slow push forward, as though stepping through the gate */
.cover.is-open .cover-stage{ transform:scale(1.07); }

/* your own cover photo, when ASSETS.cover is set */
.cover-photo,
#coverArt{
  position:absolute; inset:0;
  transition:opacity 1.5s ease .5s;
}
.cover-photo{ background-size:cover; background-position:center; }
#coverArt{ width:100%; height:100%; }
.cover.is-open .cover-photo,
.cover.is-open #coverArt{ opacity:0; }

.cover-vignette{
  position:absolute; inset:0;
  background:
    radial-gradient(85% 60% at 50% 42%, transparent 30%, rgba(38,16,16,.55) 100%),
    linear-gradient(to bottom, rgba(30,12,14,.35) 0%, transparent 25%, rgba(30,12,14,.5) 100%);
  transition:opacity 1.5s ease .5s;
}
.cover.is-open .cover-vignette{ opacity:0; }

/* the two swinging gate halves */
.gate{
  position:absolute; inset:0;
  perspective:1400px; perspective-origin:50% 45%;
}
.gate-half{
  position:absolute; top:0; bottom:0; width:50.4%;
  /* heavy doors: slow to start, then easing open */
  transition:transform 2.2s cubic-bezier(.34,.05,.2,1);
  will-change:transform;
  backface-visibility:hidden;
}
.gate-half svg{ width:100%; height:100%; }
.gate-half.l{ left:0;  transform-origin:left center;  }
/* the right leaf lags a fraction — hand-pushed, not mechanical */
.gate-half.r{ right:0; transform-origin:right center; transition-delay:.09s; }
.cover.is-open .gate-half.l{ transform:rotateY(-104deg); }
.cover.is-open .gate-half.r{ transform:rotateY( 104deg); }

.gate-bow{
  position:absolute; left:50%; top:52%;
  width:44%; translate:-50% -50%;
  transition:opacity .8s ease .1s,
             transform 1.2s cubic-bezier(.4,0,.5,1);
  filter:drop-shadow(0 6px 14px rgba(40,14,16,.4));
}
.cover.is-open .gate-bow{
  opacity:0;
  transform:translateY(80px) rotate(9deg) scale(.95);
}

/* ---------- Ganesha at the crown of the arch --------------
   Sits OUTSIDE .gate on purpose: the doors swing away
   beneath it, the blessing over the threshold stays put.   */
.ganesha{
  position:absolute; left:50%; top:4.5%;
  translate:-50% 0;
  z-index:6;
  display:grid; justify-items:center; gap:11px;
  /* an explicit width, not max-content: a long shloka would
     otherwise outgrow the stage and get clipped by overflow  */
  width:min(340px, 86%);
  pointer-events:none;
  /* `translate` does the centring and stays put; the entrance and
     exit ride on `transform`, so they never fight each other.
     No fill-mode, so the transition below can take over once the
     entrance has finished.                                      */
  animation:settle 1.5s cubic-bezier(.2,.7,.25,1);
  transition:opacity 1.2s ease 1s, transform 1.7s ease 1s;
}
@keyframes settle{
  from{ opacity:0; transform:translateY(-14px); }
  to  { opacity:1; transform:none; }
}
/* the blessing lifts away rather than blinking out */
.cover.is-open .ganesha{ opacity:0; transform:translateY(-34px); }
/* a soft elliptical pool of shade so gold reads against the
   flowers — sized to the block, not a fixed circle, or a long
   verse would drag it across the whole cover                 */
.ganesha::before{
  content:''; position:absolute;
  left:50%; top:47%; translate:-50% -50%;
  width:128%; height:186%;
  background:radial-gradient(closest-side ellipse at 50% 50%,
             rgba(38,16,16,.70) 0%, rgba(38,16,16,.42) 52%, rgba(38,16,16,0) 78%);
  z-index:-1;
}
.niche{
  position:relative;
  width:clamp(66px, 19vw, 92px);
  aspect-ratio:100/116;
  filter:drop-shadow(0 3px 10px rgba(30,10,12,.55));
}
.niche svg{ position:absolute; inset:0; width:100%; height:100%; }
/* your image, clipped into the temple niche */
.niche-art{
  position:absolute; inset:0;
  clip-path:url(#nicheClip);
  background-size:cover; background-position:center 22%;
  display:grid; place-items:center;
}
.niche-art.is-glyph{
  background:radial-gradient(120% 100% at 50% 18%, rgba(255,238,205,.16), rgba(255,238,205,0) 70%);
}
/* the drawn idol is line art, so it is NOT clipped to the arch —
   its ears are meant to graze the inner edge                    */
.niche-idol{ pointer-events:none; }
.niche.has-art .niche-idol{ display:none; }
.niche.has-idol .niche-art{ display:none; }
.niche-art .om{
  font-family:var(--f-deva);
  font-size:clamp(30px,8.6vw,42px);
  line-height:1;
  margin-top:14%;
  color:var(--gold-pale);
  text-shadow:0 2px 8px rgba(30,10,12,.6);
}
.invocation{
  font-family:var(--f-deva);
  font-size:clamp(11.5px,3.1vw,13.5px);
  letter-spacing:.03em;
  line-height:1.85;
  color:var(--gold-pale);
  text-shadow:0 1px 3px rgba(30,10,12,.95), 0 2px 12px rgba(30,10,12,.8);
  margin:0; text-align:center;
  max-width:100%;
}
/* each pada of the verse is its own block, so if one has to wrap
   on a narrow phone the two halves still read as two halves    */
.invocation .line{
  display:block;
  text-wrap:balance;
  overflow-wrap:break-word;
}
/* a shorter line at the top of the hero — this one may stay on
   a single line, since it is deliberately kept brief           */
.hero-invocation{
  margin-bottom:16px;
  opacity:.92;
  font-size:clamp(12px,3.2vw,14px);
  white-space:nowrap;
}

.cover-cta{
  position:absolute; left:0; right:0; bottom:19%;
  display:flex; flex-direction:column; align-items:center; gap:10px;
  background:none; border:0; cursor:pointer; padding:16px;
  transition:opacity .5s ease;
}
.cover.is-open .cover-cta{ opacity:0; pointer-events:none; }
.cover-cta .label{
  font-family:var(--f-serif);
  font-size:clamp(21px,5.6vw,26px);
  letter-spacing:.1em;
  color:var(--gold-pale);
  text-shadow:0 2px 12px rgba(30,10,12,.75);
}
.cover-cta .pulse{
  width:44px; height:44px; border-radius:50%;
  border:1px solid rgba(239,203,134,.55);
  display:grid; place-items:center;
  animation:pulse 2.4s ease-in-out infinite;
}
.cover-cta .pulse svg{ width:16px; height:16px; stroke:var(--gold-pale); }
@keyframes pulse{
  0%,100%{ transform:scale(1);    box-shadow:0 0 0 0 rgba(239,203,134,.30); }
  70%    { transform:scale(1.04); box-shadow:0 0 0 16px rgba(239,203,134,0); }
}

/* ============================================================
   2 · NIGHT HERO
   ============================================================ */
.hero{
  position:relative;
  min-height:100vh; min-height:100dvh;
  display:grid; align-content:center;
  padding:16vh var(--pad) 12vh;
  background:var(--night);
  overflow:hidden;
  isolation:isolate;
}
.hero-photo{ position:absolute; inset:0; background-size:cover; background-position:center; }
#heroArt{ position:absolute; inset:0; width:100%; height:100%; }
.hero-scrim{
  position:absolute; inset:0;
  background:
    radial-gradient(70% 45% at 50% 30%, rgba(16,23,51,0) 0%, rgba(11,15,36,.55) 100%),
    linear-gradient(to bottom, rgba(9,13,32,.5) 0%, rgba(9,13,32,.1) 38%, rgba(9,13,32,.78) 100%);
}
/* ornamental pillars framing the scene */
.hero-frame{ position:absolute; inset:0; pointer-events:none; }
.hero-frame svg{ width:100%; height:100%; }

.hero-inner{ position:relative; text-align:center; }

.eyebrow{
  font-size:clamp(13px,3.4vw,15px);
  letter-spacing:.34em; text-transform:uppercase;
  color:rgba(246,236,226,.82);
}
.hero .eyebrow{ margin-bottom:6px; }
.hero-heart{ margin:0 auto 18px; width:16px; fill:#f0c3c6; opacity:.9; }

.names{ display:grid; gap:2px; }
.name{
  font-family:var(--f-name);
  font-size:clamp(52px,15vw,74px);
  line-height:1.02;
  color:var(--gold);
  background:linear-gradient(178deg,#f6dfa4 6%,#d8a441 52%,#b47c27 100%);
  -webkit-background-clip:text; background-clip:text;
  -webkit-text-fill-color:transparent;
  filter:drop-shadow(0 3px 10px rgba(0,0,0,.45));
  padding-bottom:.06em;
}
.parent{
  font-size:clamp(13px,3.5vw,15px);
  font-style:italic;
  color:rgba(246,236,226,.9);
  line-height:1.5;
  margin:2px 0 0;
  text-wrap:balance;
}
.amp{
  font-family:var(--f-name);
  font-size:clamp(34px,9vw,44px);
  color:var(--gold-pale);
  margin:10px 0 4px;
  opacity:.95;
}
.hero-date{
  margin-top:26px;
  font-size:clamp(15px,4vw,17px);
  letter-spacing:.2em; text-transform:uppercase;
  color:var(--ivory);
}
.hero-date span{ display:block; letter-spacing:.12em; text-transform:none;
  font-style:italic; font-size:.9em; opacity:.75; margin-top:5px; }

.scroll-cue{
  position:absolute; left:0; right:0; bottom:5.5vh;
  display:grid; justify-items:center; gap:6px;
  font-size:11px; letter-spacing:.4em; text-transform:uppercase;
  color:rgba(246,236,226,.6);
}
.scroll-cue svg{ width:17px; stroke:rgba(246,236,226,.6); animation:nudge 2.2s ease-in-out infinite; }
@keyframes nudge{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(6px); } }

/* ============================================================
   3 · SECTIONS on blush
   ============================================================ */
.sec{
  position:relative;
  padding:clamp(56px,13vw,82px) var(--pad);
}
.sec.tint     { background:linear-gradient(to bottom, var(--blush-soft), var(--cream)); }
.sec.tint-2   { background:var(--cream); }
.sec.tint-3   { background:linear-gradient(to bottom, var(--cream), var(--blush-soft)); }
.sec.pad-tight{ padding-top:clamp(34px,8vw,48px); }
/* soften the seam where the night sky meets the blush */
.seam{ height:70px; background:linear-gradient(to bottom, var(--night), var(--blush-soft)); }

.sec-head{ text-align:center; margin-bottom:clamp(26px,7vw,38px); }
.ico{ width:26px; height:26px; margin:0 auto 12px; stroke:var(--oxblood-soft); }
.script{
  font-family:var(--f-script);
  font-weight:400;
  font-size:clamp(31px,8.6vw,40px);
  line-height:1.15;
  color:var(--oxblood);
  margin:0;
  text-wrap:balance;
}
.rule{
  display:flex; align-items:center; justify-content:center; gap:12px;
  margin:14px auto 0; width:min(280px,72%);
}
.rule i{ flex:1; height:1px; background:linear-gradient(to right, transparent, var(--line), transparent); }
.rule svg{ width:9px; fill:var(--oxblood-soft); opacity:.75; flex:none; }

/* invitation note */
.note{
  text-align:center;
  font-style:italic;
  font-size:clamp(17px,4.6vw,19px);
  line-height:1.72;
  color:var(--oxblood-soft);
  max-width:34ch; margin-inline:auto;
  text-wrap:pretty;
}
.note + .note{ margin-top:16px; font-style:normal; font-size:clamp(15.5px,4.2vw,17px); color:var(--rose-ink); }

/* ---------- scratch card --------------------------------- */
.scratch-wrap{
  position:relative;
  width:min(320px, 82%);
  aspect-ratio:100/86;
  margin:6px auto 0;
  touch-action:none;
}
.scratch-outline{ position:absolute; inset:0; }
.scratch-outline path{ fill:none; stroke:var(--oxblood); stroke-width:.7; }
.scratch-face{
  position:absolute; inset:0;
  display:grid; align-content:center; justify-items:center;
  padding:22% 16% 20%;
  text-align:center;
}
.scratch-face .invited{
  font-style:italic; font-size:clamp(16px,4.4vw,18px);
  color:var(--oxblood-soft); margin-bottom:4px;
}
.scratch-face .big-date{
  font-weight:600; font-size:clamp(19px,5.2vw,23px);
  letter-spacing:.01em; color:var(--oxblood);
}
.scratch-face .sub{ font-size:14.5px; color:var(--rose-ink); margin-top:2px; }
.scratch-face .sub.time{ font-size:13px; opacity:.85; }
#scratchCanvas{
  position:absolute; inset:0; width:100%; height:100%;
  clip-path:url(#heartClip);
  cursor:grab;
  transition:opacity .7s ease;
}
#scratchCanvas.is-done{ opacity:0; pointer-events:none; }
.scratch-hint{
  text-align:center; font-size:13px; font-style:italic;
  color:var(--rose-ink); opacity:.8; margin-top:18px;
  transition:opacity .4s ease;
}
.scratch-hint.is-hidden{ opacity:0; }
#confetti{ position:fixed; inset:0; z-index:65; pointer-events:none; }

/* ---------- photo card ----------------------------------- */
.photo{
  position:relative;
  border-radius:2px;
  overflow:hidden;
  background:var(--shade);
  box-shadow:0 14px 34px rgba(107,33,28,.14);
}
.photo::after{
  content:''; position:absolute; inset:0;
  border:1px solid rgba(253,247,243,.4);
  pointer-events:none;
}
.photo img{ width:100%; height:100%; object-fit:cover; aspect-ratio:4/3; }
.photo.tall img{ aspect-ratio:3/4; }
.caption{
  text-align:center; font-style:italic; font-size:14.5px;
  color:var(--rose-ink); margin-top:12px;
}

/* ---------- countdown ------------------------------------ */
.count{
  display:grid; grid-template-columns:repeat(4,1fr);
  gap:clamp(7px,2.4vw,12px);
}
.cell{
  background:var(--cream);
  border:1px solid var(--line-soft);
  border-radius:3px;
  padding:clamp(13px,3.6vw,18px) 4px clamp(10px,2.8vw,13px);
  text-align:center;
  box-shadow:0 3px 10px rgba(107,33,28,.05);
}
.cell b{
  display:block;
  font-weight:600;
  font-size:clamp(26px,7.6vw,34px);
  line-height:1;
  color:var(--oxblood);
  font-variant-numeric:tabular-nums lining-nums;
}
.cell span{
  display:block; margin-top:7px;
  font-size:10.5px; letter-spacing:.18em; text-transform:uppercase;
  color:var(--rose-ink);
}

/* ---------- timeline ------------------------------------- */
.timeline{ display:grid; gap:clamp(20px,5vw,26px); max-width:32ch; margin-inline:auto; }
.tl-item{ display:grid; grid-template-columns:auto 1fr; gap:14px; align-items:start; }
.tl-dot{
  width:9px; height:9px; margin-top:9px; border-radius:50%;
  background:var(--oxblood-soft);
  box-shadow:0 0 0 4px rgba(138,65,58,.12);
}
.tl-item h3{
  margin:0; font-weight:600;
  font-size:clamp(17.5px,4.7vw,19.5px);
  color:var(--oxblood);
}
.tl-item p{ margin:3px 0 0; font-size:15px; color:var(--rose-ink); font-variant-numeric:lining-nums; }
.tl-item p.where{ font-style:italic; opacity:.9; }

/* ---------- venue ---------------------------------------- */
.venue-name{
  text-align:center; font-weight:600;
  font-size:clamp(21px,5.6vw,25px);
  color:var(--oxblood);
}
.venue-city{ text-align:center; font-size:15.5px; color:var(--rose-ink); margin-top:4px; }
.venue-addr{ text-align:center; font-size:14.5px; font-style:italic; color:var(--rose-ink); margin-top:8px; max-width:30ch; margin-inline:auto; }
.map{
  position:relative; margin-top:22px;
  aspect-ratio:5/4; border-radius:3px; overflow:hidden;
  border:1px solid var(--line-soft);
  background:#e9e3dc;
}
.map canvas, .map iframe{ width:100%; height:100%; border:0; display:block; }
.map-pill{
  position:absolute; left:12px; top:12px;
  display:inline-flex; align-items:center; gap:7px;
  padding:8px 14px; border-radius:999px;
  background:rgba(253,247,243,.93);
  border:1px solid var(--line-soft);
  box-shadow:0 3px 12px rgba(60,20,20,.16);
  font-size:13.5px; color:var(--oxblood);
  text-decoration:none;
}
.map-pill svg{ width:13px; stroke:var(--oxblood); }
.map-pill:hover{ background:var(--cream); }

/* ---------- simple info list ----------------------------- */
.info{ display:grid; gap:20px; max-width:32ch; margin-inline:auto; }
.info-row h3{ margin:0 0 3px; font-weight:600; font-size:17px; color:var(--oxblood); }
.info-row p{ margin:0; font-size:15px; color:var(--rose-ink); }
.body-line{
  text-align:center; font-size:clamp(15.5px,4.2vw,17px);
  color:var(--rose-ink); max-width:32ch; margin-inline:auto;
  text-wrap:pretty;
}

/* ---------- RSVP form ------------------------------------ */
.form{ display:grid; gap:17px; max-width:34ch; margin-inline:auto; }
.field{ display:grid; gap:6px; }
.field > label{
  font-size:12.5px; letter-spacing:.12em; text-transform:uppercase;
  color:var(--oxblood-soft);
}
.field .req{ color:var(--gold); }
.field input,.field select,.field textarea{
  font-family:var(--f-serif); font-size:16px;
  color:var(--oxblood);
  background:var(--cream);
  border:0; border-bottom:1px solid var(--line);
  border-radius:0;
  padding:9px 2px;
  width:100%;
  appearance:none;
}
.field textarea{ resize:vertical; min-height:74px; line-height:1.55; }
.field input::placeholder,.field textarea::placeholder{ color:rgba(138,95,89,.6); font-style:italic; }
.field input:focus,.field select:focus,.field textarea:focus{
  outline:none; border-bottom-color:var(--gold);
}
.select-wrap{ position:relative; }
.select-wrap svg{
  position:absolute; right:4px; top:50%; translate:0 -50%;
  width:13px; stroke:var(--oxblood-soft); pointer-events:none;
}
.submit{
  margin-top:6px; padding:15px;
  background:var(--oxblood); color:var(--ivory);
  border:0; border-radius:2px; cursor:pointer;
  font-size:15px; letter-spacing:.1em;
  transition:background .25s ease, transform .12s ease;
}

/* ============================================================
   4 · FLOATING CONTROLS
   ============================================================ */
.ctl{
  position:fixed; z-index:80;
  display:inline-flex; align-items:center; gap:7px;
  padding:9px 13px; border-radius:999px;
  background:rgba(253,247,243,.9);
  border:1px solid rgba(107,33,28,.14);
  box-shadow:0 4px 16px rgba(60,20,20,.18);
  backdrop-filter:blur(8px);
  font-size:13px; color:var(--oxblood);
  cursor:pointer;
  transition:opacity .8s ease, background .25s ease;
}
.ctl:hover{ background:var(--cream); }
.ctl svg{ width:15px; height:15px; flex:none; stroke:var(--oxblood); }
#musicBtn{ top:calc(14px + env(safe-area-inset-top)); right:14px; padding:10px; }
#musicBtn .off{ display:none; }
#musicBtn.is-muted .on{ display:none; }
#musicBtn.is-muted .off{ display:block; }
#langBtn{ bottom:calc(16px + env(safe-area-inset-bottom)); left:14px; }
/* the label names the language you'd switch TO, so it needs a
   stack covering every script the cycle can land on          */
#langLabel{ font-family:var(--f-any); }
.ctl.is-hidden{ opacity:0; pointer-events:none; }

/* desktop: keep the controls hugging the column */
@media (min-width:600px){
  #musicBtn{ right:calc(50vw - var(--col)/2 + 14px); }
  #langBtn { left: calc(50vw - var(--col)/2 + 14px); }
}

/* ============================================================
   5 · REVEAL ON SCROLL
   ============================================================ */
.reveal{
  opacity:0; transform:translateY(20px);
  transition:opacity .85s cubic-bezier(.2,.7,.25,1), transform .85s cubic-bezier(.2,.7,.25,1);
  transition-delay:var(--d,0ms);
}
.reveal.in{ opacity:1; transform:none; }

/* ============================================================
   6 · INDIC SCRIPTS — Great Vibes, Parisienne and EB Garamond
   carry no Devanagari or Bengali at all, so Hindi and Bangla
   swap the display faces out and rebalance the sizes. The
   `indic` class is set alongside lang="…" by applyLang().
   ============================================================ */
html[lang="hi"]{ --f-indic:var(--f-deva);   }
html[lang="bn"]{ --f-indic:var(--f-bangla); }

html.indic body,
html.indic .field input,
html.indic .field select,
html.indic .field textarea{ font-family:var(--f-indic); }
html.indic .script{
  font-family:var(--f-indic); font-style:italic;
  font-size:clamp(24px,6.4vw,30px); line-height:1.4;
}
html.indic .name{
  font-family:var(--f-indic); font-style:normal;
  font-size:clamp(38px,11vw,52px); line-height:1.3;
  padding-bottom:0;
}
html.indic .amp,
html.indic .signature{ font-family:var(--f-indic); }
html.indic .signature{ font-size:clamp(23px,6vw,28px); }
html.indic .note{ font-style:normal; line-height:1.9; }
html.indic .cell span,
html.indic .field > label{ letter-spacing:.04em; }
html.indic .eyebrow,
html.indic .hero-date{ letter-spacing:.12em; }
/* Bengali sits a touch larger on the same optical line */
html[lang="bn"] .script{ font-size:clamp(23px,6.1vw,29px); }
html[lang="bn"] .invocation{ font-family:var(--f-bangla); }

@media (prefers-reduced-motion:reduce){
  *{ animation-duration:.001ms !important; animation-iteration-count:1 !important; }
  .reveal{ opacity:1; transform:none; transition:none; }
  .scroll-cue svg{ animation:none; }
  /* the same sequence, collapsed to about half a second —
     OPEN_MS in the script matches this branch too */
  .gate-half{ transition-duration:.4s; transition-delay:0s; }
  .cover{ transition:opacity .3s ease .4s, visibility .3s ease .4s; }
  .cover-stage{ transition:none; }
  .cover.is-open .cover-stage{ transform:none; }
  .cover-photo, #coverArt, .cover-vignette{ transition-duration:.3s; transition-delay:.1s; }
  .ganesha{ transition-duration:.3s; transition-delay:.1s; }
  .gate-bow{ transition-duration:.3s; transition-delay:0s; }
}

/* v() unwraps {en,hi} pairs. Arrays pass straight through, so a

const v  = x => Array.isArray(x) ? x

/* Write one or many lines into a node, each as its own block so a
   line that must wrap stays visually grouped. Text nodes rather
   than innerHTML — no markup, nothing to escape.               */
function setLines(node, value){
  if (!node) return '';
  const lines = (Array.isArray(value) ? value : [value]).filter(s => s !== '' && s != null);
  node.textContent = '';
  lines.forEach(line => {
    const span = document.createElement('span');
    span.className = 'line';
    span.textContent = line;
    node.appendChild(span);
  });
  node.hidden = !lines.length;
  return lines.join(' ');
}

function paintIcons(root = document){
  $$('[data-ico]', root).forEach(node => {
    const key = node.dataset.ico, d = ICONS[key];
    if (!d) return;
    const solid = key === 'heartSolid';
    if (node.tagName.toLowerCase() === 'svg'){
      node.setAttribute('viewBox', solid ? '0 0 100 86' : '0 0 24 24');
      node.setAttribute('fill', solid ? 'currentColor' : 'none');
      if (!solid){
        node.setAttribute('stroke-width','1.3');
        node.setAttribute('stroke-linecap','round');
        node.setAttribute('stroke-linejoin','round');
      }
      node.innerHTML = d;
    } else {
      node.innerHTML =
        `<svg viewBox="${solid ? '0 0 100 86' : '0 0 24 24'}" fill="${solid ? 'currentColor' : 'none'}"
              stroke="currentColor" stroke-width="1.3" stroke-linecap="round"
              stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
    }
    delete node.dataset.ico;
  });
}

/* ================================================================
   Canvas art — the gate, the night sky, the little maps
   ================================================================ */
function fitCanvas(cv){
  const dpr = Math.min(devicePixelRatio || 1, 2);
  const r = cv.getBoundingClientRect();
  const w = Math.max(1, Math.round(r.width)), h = Math.max(1, Math.round(r.height));
  cv.width = w * dpr; cv.height = h * dpr;
  const ctx = cv.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return { ctx, w, h };
}

/* --- cover backdrop: a floral arch over warm light ------------- */
function drawCoverArt(){

/* --- the night hero: moon, palace, fairy lights --------------- */
let heroRAF = 0;
function drawHeroArt(){
  const cv = $('#heroArt'); if (!cv) return;
  const { ctx, w, h } = fitCanvas(cv);

  const stars = Array.from({ length: 130 }, (_, i) => ({
    x: ((i * 73) % 997) / 997 * w,
    y: ((i * 149) % 613) / 613 * h * .62,
    r: .5 + ((i * 31) % 13) / 13 * 1.1,
    p: ((i * 17) % 100) / 100 * 6.284
  }));
  const flakes = Array.from({ length: 46 }, (_, i) => ({
    x: ((i * 197) % 811) / 811 * w,
    y: ((i * 89)  % 733) / 733 * h,
    r: .7 + ((i * 41) % 10) / 10 * 1.5,
    s: .12 + ((i * 23) % 10) / 10 * .3,
    d: ((i * 53) % 100) / 100 * 6.284
  }));

  const moonX = w * .5, moonY = h * .27, moonR = Math.min(w, h) * .135;

  function frame(ms){
    const tt = ms / 1000;

    /* sky */
    const sky = ctx.createLinearGradient(0, 0, 0, h);
    sky.addColorStop(0,   '#080c22');
    sky.addColorStop(.34, '#151d40');
    sky.addColorStop(.60, '#2b2a52');
    sky.addColorStop(.80, '#4a3350');
    sky.addColorStop(1,   '#1b1730');
    ctx.fillStyle = sky; ctx.fillRect(0, 0, w, h);

    /* stars */
    stars.forEach(s => {
      const a = .35 + .45 * (.5 + .5 * Math.sin(tt * 1.1 + s.p));
      ctx.fillStyle = `rgba(233,235,255,${a})`;
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.284); ctx.fill();
    });

    /* moon halo + disc */
    const halo = ctx.createRadialGradient(moonX, moonY, moonR * .8, moonX, moonY, moonR * 3.6);
    halo.addColorStop(0, 'rgba(226,231,255,.30)');
    halo.addColorStop(1, 'rgba(226,231,255,0)');
    ctx.fillStyle = halo;
    ctx.beginPath(); ctx.arc(moonX, moonY, moonR * 3.6, 0, 6.284); ctx.fill();

    const disc = ctx.createRadialGradient(moonX - moonR * .3, moonY - moonR * .35, moonR * .1,
                                          moonX, moonY, moonR);
    disc.addColorStop(0,  '#fbfaf6');
    disc.addColorStop(.7, '#e6e4dd');
    disc.addColorStop(1,  '#c9c8c4');
    ctx.fillStyle = disc;
    ctx.beginPath(); ctx.arc(moonX, moonY, moonR, 0, 6.284); ctx.fill();
    ctx.save();
    ctx.beginPath(); ctx.arc(moonX, moonY, moonR, 0, 6.284); ctx.clip();
    ctx.fillStyle = 'rgba(160,158,158,.22)';
    [[-.32,-.18,.22],[.24,.06,.16],[-.06,.34,.19],[.34,-.36,.11],[-.44,.16,.09]]
      .forEach(([dx, dy, rr]) => {
        ctx.beginPath();
        ctx.arc(moonX + dx * moonR, moonY + dy * moonR, rr * moonR, 0, 6.284);
        ctx.fill();
      });
    ctx.restore();

    /* palace silhouette with lit windows */
    const base = h * .70;
    ctx.fillStyle = '#120f26';
    ctx.beginPath(); ctx.moveTo(0, base);
    const towers = [
      [.10,.09],[.20,.15],[.30,.11],[.40,.20],[.50,.26],
      [.60,.20],[.70,.11],[.80,.15],[.90,.09]
    ];
    towers.forEach(([tx, th]) => {
      const x = tx * w, tw = w * .052, top = base - h * th;
      ctx.lineTo(x - tw, base); ctx.lineTo(x - tw, top + h * .022);
      ctx.quadraticCurveTo(x, top - h * .026, x + tw, top + h * .022);
      ctx.lineTo(x + tw, base);
    });
    ctx.lineTo(w, base); ctx.lineTo(w, h); ctx.lineTo(0, h); ctx.closePath(); ctx.fill();

    towers.forEach(([tx, th], i) => {
      for (let k = 0; k < 3; k++){
        const x = tx * w + (k - 1) * w * .020;
        const y = base - h * th * (.30 + k * .16) + h * .05;
        const a = .5 + .4 * Math.sin(tt * .7 + i * 1.7 + k);
        ctx.fillStyle = `rgba(255,206,126,${a * .85})`;
        ctx.fillRect(x - 1.5, y, 3, 6);
      }
    });

    /* water and its shimmer */
    const water = ctx.createLinearGradient(0, base, 0, h);
    water.addColorStop(0, 'rgba(120,96,132,.5)');
    water.addColorStop(1, 'rgba(24,20,42,.9)');
    ctx.fillStyle = water; ctx.fillRect(0, base, w, h - base);

      ctx.lineWidth = 1;
      ctx.beginPath();
      const off = Math.sin(tt * .9 + i * .6) * w * .05;
      ctx.moveTo(moonX - w * .12 + off, y); ctx.lineTo(moonX + w * .12 + off, y);
      ctx.stroke();

    /* fairy-light garland strung across the top */
    for (let g = 0; g < 2; g++){
      const sag = h * (.052 + g * .028), y0 = h * (.035 + g * .045);
      ctx.strokeStyle = 'rgba(232,214,196,.22)'; ctx.lineWidth = 1;
      ctx.beginPath();
      for (let p = 0; p <= 60; p++){
        const tx = p / 60, x = tx * w, y = y0 + Math.sin(Math.PI * tx) * sag;
        p ? ctx.lineTo(x, y) : ctx.moveTo(x, y);

      ctx.stroke();

        const tx = p / 22, x = tx * w, y = y0 + Math.sin(Math.PI * tx) * sag;
        const a = .45 + .4 * Math.sin(tt * 1.5 + p * .9 + g);

        gl.addColorStop(1, 'rgba(255,214,150,0)');
        ctx.fillStyle = gl; ctx.beginPath(); ctx.arc(x, y, 7, 0, 6.284); ctx.fill();
        ctx.fillStyle = `rgba(255,244,224,${a})`;
        ctx.beginPath(); ctx.arc(x, y, 1.5, 0, 6.284); ctx.fill();
      }
    }

    /* drifting sparkle */
    flakes.forEach(f => {
      f.y += f.s; if (f.y > h) { f.y = -4; }
      const x = f.x + Math.sin(tt * .5 + f.d) * 9;
      ctx.fillStyle = 'rgba(255,246,232,.5)';
      ctx.beginPath(); ctx.arc(x, f.y, f.r, 0, 6.284); ctx.fill();
    });

    if (!reduceMotion) heroRAF = requestAnimationFrame(frame);
  }

}

  ctx.beginPath(); ctx.ellipse(px, py + 15, 11, 4, 0, 0, 6.284); ctx.fill();
  ctx.fillStyle = '#6b211c';
  ctx.beginPath();
  ctx.arc(px, py, 10, Math.PI * .82, Math.PI * .18);
  ctx.lineTo(px, py + 19); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#f3dcda';
  ctx.beginPath(); ctx.arc(px, py - 1, 3.7, 0, 6.284); ctx.fill();

  /* paper tint so it sits with the palette */
  ctx.fillStyle = 'rgba(233,196,196,.16)'; ctx.fillRect(0, 0, w, h);
}

function startCountdown(){
  const box = $('#countdown');
  const keys = ['days','hours','minutes','seconds'];
  box.innerHTML = keys.map(k =>
    `<div class="cell"><b data-k="${k}">00</b><span data-i18n="${k}">${t(k)}</span></div>`).join('');
  const out = {};
  keys.forEach(k => out[k] = box.querySelector(`[data-k="${k}"]`));

  const tick = () => {
    let ms = WEDDING - Date.now();
    if (ms <= 0){
      box.innerHTML = `<p class="body-line" style="grid-column:1/-1">${t('theDayIsHere')}</p>`;
      clearInterval(id); return;
    }
    const s = Math.floor(ms / 1000);
    const val = {
      days:    Math.floor(s / 86400),
      hours:   Math.floor(s % 86400 / 3600),
      minutes: Math.floor(s % 3600 / 60),
      seconds: s % 60
    };
    keys.forEach(k => out[k].textContent = String(val[k]).padStart(2, '0'));
  };
  const id = setInterval(tick, 1000);
  tick();
}

/* ================================================================
   Scratch to reveal
   ================================================================ */
function initScratch(){
  const cv = $('#scratchCanvas');
  const hint = $('#scratchHint');
  let ctx, dpr = 1, done = false, moves = 0, drawing = false, last = null;

  function paint(){
    const r = cv.getBoundingClientRect();
    dpr = Math.min(devicePixelRatio || 1, 2);
    cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
    ctx = cv.getContext('2d', { willReadFrequently:true });
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const w = r.width, h = r.height;

    const g = ctx.createLinearGradient(0, 0, w, h);
    g.addColorStop(0,   '#f0cfd0');
    g.addColorStop(.42, '#e2adb1');
    g.addColorStop(1,   '#cf8f96');
    ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);

    /* a little foil shimmer so it reads as something to scratch */
    for (let i = 0; i < 140; i++){
      const x = ((i * 137) % 991) / 991 * w;
      const y = ((i * 79)  % 787) / 787 * h;
      ctx.fillStyle = i % 3 ? 'rgba(255,255,255,.30)' : 'rgba(216,164,65,.34)';
      ctx.beginPath(); ctx.arc(x, y, .8 + (i % 5) * .4, 0, 6.284); ctx.fill();
    }
    ctx.strokeStyle = 'rgba(255,255,255,.28)'; ctx.lineWidth = 1;
    for (let i = -h; i < w; i += 16){
      ctx.beginPath(); ctx.moveTo(i, h); ctx.lineTo(i + h, 0); ctx.stroke();
    }
    ctx.globalCompositeOperation = 'destination-out';
  }

  function erase(x, y){
    const R = 26;
    if (last){
      const dx = x - last.x, dy = y - last.y;
      const steps = Math.max(1, Math.hypot(dx, dy) / 7);
      for (let i = 0; i <= steps; i++){
        ctx.beginPath();
        ctx.arc(last.x + dx * i / steps, last.y + dy * i / steps, R, 0, 6.284);
        ctx.fill();
      }
    }
    ctx.beginPath(); ctx.arc(x, y, R, 0, 6.284); ctx.fill();
    last = { x, y };
  }

  function cleared(){
    const d = ctx.getImageData(0, 0, cv.width, cv.height).data;
    let gone = 0, total = 0;
    for (let i = 3; i < d.length; i += 4 * 24){ total++; if (d[i] < 32) gone++; }
    return total ? gone / total : 0;
  }

  function finish(){
    if (done) return;
    done = true;
    cv.classList.add('is-done');
    hint.classList.add('is-hidden');
    burstConfetti($('#scratchWrap'));
  }

  const pos = e => {
    const r = cv.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  };
  cv.addEventListener('pointerdown', e => {
    if (done) return;
    drawing = true; last = null;
    cv.setPointerCapture?.(e.pointerId);
    const p = pos(e); erase(p.x, p.y);
  });
  cv.addEventListener('pointermove', e => {
    if (!drawing || done) return;
    e.preventDefault();
    const p = pos(e); erase(p.x, p.y);
    if (++moves % 9 === 0 && cleared() > .48) finish();
  });
  const up = () => {
    if (!drawing) return;
    drawing = false; last = null;
    if (!done && cleared() > .34) finish();
  };
  cv.addEventListener('pointerup', up);
  cv.addEventListener('pointercancel', up);
  cv.addEventListener('pointerleave', up);
  /* keyboard / reduced-motion path: one press reveals it */
  cv.tabIndex = 0;
  cv.setAttribute('aria-label', t('scratchHint'));
  cv.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); finish(); }
  });

  paint();
  addEventListener('resize', () => { if (!done) paint(); }, { passive:true });
}

/* ================================================================
   Confetti
   ================================================================ */
function burstConfetti(anchor){
  const cv = $('#confetti');
  const { ctx, w, h } = fitCanvas(cv);
  const r = anchor.getBoundingClientRect();
  const ox = r.left + r.width / 2, oy = r.top + r.height / 2;
  const colors = ['#d8a441','#6b211c','#e2adb1','#fdf7f3','#8a413a','#efcb86'];
  const N = reduceMotion ? 40 : 130;

  const bits = Array.from({ length: N }, (_, i) => {
    const a = (i / N) * 6.284 + Math.random() * .5;
    const sp = 3 + Math.random() * 8;
    return {
      x: ox + (Math.random() - .5) * r.width * .5,
      y: oy + (Math.random() - .5) * r.height * .4,
      vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 4,
      s: 3 + Math.random() * 5, rot: Math.random() * 6.284,
      vr: (Math.random() - .5) * .28,
      c: colors[i % colors.length], heart: i % 5 === 0, life: 1
    };
  });

  let raf;
  (function step(){
    ctx.clearRect(0, 0, w, h);
    let alive = 0;
    bits.forEach(b => {
      if (b.life <= 0) return;
      alive++;
      b.vy += .19; b.vx *= .992;
      b.x += b.vx; b.y += b.vy; b.rot += b.vr;
      b.life -= .0072;
      ctx.save();
      ctx.globalAlpha = Math.max(0, Math.min(1, b.life * 1.5));
      ctx.translate(b.x, b.y); ctx.rotate(b.rot);
      ctx.fillStyle = b.c;
      if (b.heart){
        const k = b.s / 46;
        ctx.scale(k, k); ctx.translate(-50, -43);
        ctx.fill(new Path2D('M50,84 C22,64 4,45 4,27 C4,13 15,4 27,4 C37,4 45,10 50,18 C55,10 63,4 73,4 C85,4 96,13 96,27 C96,45 78,64 50,84 Z'));
      } else {
        ctx.fillRect(-b.s / 2, -b.s / 4, b.s, b.s / 2);
      }
      ctx.restore();
    });
    if (alive) raf = requestAnimationFrame(step);
    else { ctx.clearRect(0, 0, w, h); cancelAnimationFrame(raf); }
  })();
}

/* ================================================================
   Music — your song if you gave one, otherwise a soft harp motif
   ================================================================ */
const Music = (() => {
  let audio = null, actx = null, master = null, timer = null, playing = false;

  function useFile(){
    audio = new Audio(CONFIG.assets.song);
    audio.loop = true; audio.preload = 'auto'; audio.volume = 0;
    return audio;
  }

  function fade(target, ms){
    if (!audio) return;
    const from = audio.volume, t0 = performance.now();
    (function s(){
      const k = Math.min(1, (performance.now() - t0) / ms);
      audio.volume = from + (target - from) * k;
      if (k < 1) requestAnimationFrame(s);
    })();
  }

  /* a gentle pentatonic harp figure, used until you paste a song in */
  function startSynth(){
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (!master){
      master = actx.createGain();
      master.gain.value = 0;
      const lp = actx.createBiquadFilter();
      lp.type = 'lowpass'; lp.frequency.value = 2600;
      master.connect(lp); lp.connect(actx.destination);
    }
    master.gain.cancelScheduledValues(actx.currentTime);
    master.gain.linearRampToValueAtTime(.16, actx.currentTime + 1.6);

    /* soft drone underneath */
    [130.81, 196.00].forEach((f, i) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = 'sine'; o.frequency.value = f;
      g.gain.value = i ? .028 : .042;
      o.connect(g); g.connect(master); o.start();
    });

    const scale = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33, 659.25];
    let i = 0;
    const pluck = () => {
      const f = scale[[0,2,4,5,7,4,2,1,3,5,6,4][i % 12]] * (i % 24 < 12 ? 1 : .5);
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = 'triangle'; o.frequency.value = f;
      const now = actx.currentTime;
      g.gain.setValueAtTime(0, now);
      g.gain.linearRampToValueAtTime(.10, now + .012);
      g.gain.exponentialRampToValueAtTime(.0008, now + 2.4);
      o.connect(g); g.connect(master);
      o.start(now); o.stop(now + 2.5);
      i++;
      timer = setTimeout(pluck, 620 + (i % 4 === 0 ? 380 : 0));
    };
    pluck();
  }

  return {
    available(){ return true; },
    async play(){
      if (playing) return;
      playing = true;
      if (CONFIG.assets.song){
        (audio || useFile());
        try { await audio.play(); fade(.55, 2200); }
        catch { playing = false; throw new Error('blocked'); }
      } else {
        startSynth();
      }
    },
    pause(){
      playing = false;
      if (audio) { fade(0, 500); setTimeout(() => audio && audio.pause(), 520); }
      if (master) master.gain.linearRampToValueAtTime(0, actx.currentTime + .4);
      clearTimeout(timer);
    },
    resume(){
      playing = true;
      if (audio) { audio.play(); fade(.55, 900); }
      else if (master) master.gain.linearRampToValueAtTime(.16, actx.currentTime + .8);
      else startSynth();
    },
    get playing(){ return playing; }
  };
})();

/* ================================================================
   RSVP
   ================================================================ */
const GFORM_ACTION = id => `https://docs.google.com/forms/d/e/${id}/formResponse`;

/* Is the Google Form wired up enough to try? */
function gformReady(){
  const g = CONFIG.rsvp?.googleForm;
  return !!(g && g.formId && g.entries && g.entries.name && g.entries.attending);
}

/* Google's answers, keyed the way Google wants them. */
function gformBody(d){
  const g = CONFIG.rsvp.googleForm, p = new URLSearchParams();
  const put = (id, val) => { if (id && val !== '' && val != null) p.append(`entry.${String(id).replace(/\D/g,'')}`, val); };
  put(g.entries.name,      d.name);
  put(g.entries.email,     d.email);
  put(g.entries.guests,    d.guests);
  put(g.entries.attending, d.attending === 'yes' ? g.attendingYes : g.attendingNo);
  put(g.entries.message,   d.message);
  /* Google's own email field, only when the form collects it */
  if (g.collectsEmail && d.email) p.append('emailAddress', d.email);
  /* keeps single-page forms happy */
  p.append('fvv', '1'); p.append('pageHistory', '0'); p.append('submit', 'Submit');
  return p;
}

/* Plan A: a quiet cross-origin POST. Google sends no CORS headers,
   so the reply is opaque — a resolved promise means "delivered",
   not "accepted". That is as good as it gets without a backend. */
async function gformFetch(d){
  await fetch(GFORM_ACTION(CONFIG.rsvp.googleForm.formId), {
    method: 'POST',
    mode: 'no-cors',
    body: gformBody(d)          // urlencoded → a CORS-safelisted request
  });
}

/* Plan B: an old-fashioned form POST into a hidden iframe.
   Survives environments where fetch is walled off. */
function gformIframe(d){
  return new Promise((resolve, reject) => {
    let sink = document.getElementById('gformSink');
    if (!sink){
      sink = el('iframe');
      sink.id = 'gformSink'; sink.name = 'gformSink';
      sink.style.cssText = 'position:absolute;width:0;height:0;border:0;left:-9999px';
      document.body.appendChild(sink);
    }
    const f = el('form');
    f.action = GFORM_ACTION(CONFIG.rsvp.googleForm.formId);
    f.method = 'POST'; f.target = 'gformSink';
    f.style.display = 'none';
    for (const [k, val] of gformBody(d)){
      const i = el('input'); i.type = 'hidden'; i.name = k; i.value = val;
      f.appendChild(i);
    }
    document.body.appendChild(f);
    const done = setTimeout(() => { f.remove(); resolve(); }, 1400);
    sink.addEventListener('load', () => { clearTimeout(done); f.remove(); resolve(); }, { once:true });
    try { f.submit(); } catch (err){ clearTimeout(done); f.remove(); reject(err); }
  });
}

/* Last resort: hand the guest a prefilled WhatsApp / mail draft. */
function handoffUrl(d){
  const lines = [
    `RSVP — ${v(CONFIG.couple.a.name)} & ${v(CONFIG.couple.b.name)}`,
    `${t('fName')}: ${d.name}`,
    `${t('fEmail')}: ${d.email}`,
    d.guests  ? `${t('fGuests')}: ${d.guests}`   : null,
    `${t('fAttend')} ${d.attending === 'yes' ? t('fYes') : t('fNo')}`,
    d.message ? `${t('fMessage')}: ${d.message}` : null
  ].filter(Boolean).join('\n');

  const wa = CONFIG.rsvp?.whatsApp;
  return wa
    ? `https://wa.me/${wa.replace(/\D/g,'')}?text=${encodeURIComponent(lines)}`
    : `mailto:${CONFIG.rsvp?.email || ''}?subject=${encodeURIComponent('RSVP — ' + d.name)}`
      + `&body=${encodeURIComponent(lines)}`;
}

function initRsvp(){
  const form   = $('#rsvpForm'),
        note   = $('#formNote'),
        thanks = $('#thanks'),
        btn    = form.querySelector('.submit');

  if (CONFIG.rsvp?.googleForm?.formId && !gformReady()){
    console.warn('[RSVP] formId is set but entries.name / entries.attending are empty — ' +
                 'falling back to WhatsApp/email. See CONFIG section 7, step 3.');
  }

  const succeed = attending => {
    form.classList.add('is-off');
    thanks.classList.add('is-on');
    if (attending === 'yes') burstConfetti(thanks);
  };

  form.addEventListener('submit', async e => {
    e.preventDefault();
    const f = new FormData(form);
    const d = {
      name:      (f.get('name')    || '').toString().trim(),
      email:     (f.get('email')   || '').toString().trim(),
      guests:    (f.get('guests')  || '').toString().trim(),
      attending: (f.get('attending')|| '').toString(),
      message:   (f.get('message') || '').toString().trim()
    };

    if (!d.name || !d.email || !d.attending){
      note.textContent = t('formErr');
      note.style.color = 'var(--oxblood)';
      return;
    }

    /* no Google Form configured → straight to the handoff */
    if (!gformReady()){
      window.open(handoffUrl(d), '_blank', 'noopener');
      succeed(d.attending);
      return;
    }

    btn.disabled = true;
    btn.textContent = t('fSending');
    note.textContent = '';

    try {
      try { await gformFetch(d); }
      catch { await gformIframe(d); }
      succeed(d.attending);
    } catch (err){
      console.error('[RSVP] Google Form submit failed:', err);
      note.textContent = t('formFail');
      note.style.color = 'var(--oxblood)';
      window.open(handoffUrl(d), '_blank', 'noopener');
      succeed(d.attending);
    } finally {
      btn.disabled = false;
      btn.textContent = t('fSend');
    }
  });
}

/* ================================================================
   Reveal on scroll
   ================================================================ */
let io;
function observeReveals(root = document){
  if (reduceMotion){ $$('.reveal', root).forEach(n => n.classList.add('in')); return; }
  io = io || new IntersectionObserver(entries => {
    entries.forEach(en => {
      if (en.isIntersecting){ en.target.classList.add('in'); io.unobserve(en.target); }
    });
  }, { rootMargin:'0px 0px -12% 0px', threshold:.15 });
  $$('.reveal', root).forEach(n => io.observe(n));
}

   ================================================================ */
function applyLang(next){
  LANG = LANGS.includes(next) ? next : 'en';
  document.documentElement.lang = LANG;
  /* one hook for "this page is not in a Latin script right now" */
  document.documentElement.classList.toggle('indic', LANG !== 'en');
  $$('[data-i18n]').forEach(n => n.textContent = t(n.dataset.i18n));
  $$('[data-i18n-ph]').forEach(n => n.placeholder = t(n.dataset.i18nPh));
  $('#langLabel').textContent = t('langOther');
  renderStatic();
  renderTimeline();
  renderVenues();
  renderPreEvents();
  observeReveals();
}

  } else {
    niche.classList.add('has-idol');
    idol.innerHTML = ganeshaSvg();
  }

  /* your files, or drawn stand-ins */
  const A = CONFIG.assets;
  if (A.cover){ const n = $('#coverPhoto'); n.hidden = false; n.style.backgroundImage = `url("${A.cover}")`; $('#coverArt').hidden = true; }
  else drawCoverArt();

  if (A.hero){ const n = $('#heroPhoto'); n.hidden = false; n.style.backgroundImage = `url("${A.hero}")`; $('#heroArt').hidden = true; }
  else drawHeroArt();

  const img = $('#photoMain');
  img.src = A.photo || placeholderPhoto(900, 675, 'YOUR PHOTO HERE');
  img.alt = `${v(CONFIG.couple.a.name)} & ${v(CONFIG.couple.b.name)}`;

  applyLang(LANG);

  /* The language control is live on the cover, unlike the music
     button: the invocation is the first thing read, so the guest
     needs to be able to switch script before the doors open.
     (Music has to wait — audio can't start without a gesture.)  */
  $('#langBtn').classList.remove('is-hidden');

  startCountdown();
  initScratch();
  initRsvp();

  /* keep the page still behind the closed gate */
  document.body.classList.add('is-locked');

  /* --- open the gate ------------------------------------- */
  const cover = $('#cover'), musicBtn = $('#musicBtn'), langBtn = $('#langBtn');

  /* Must match the cover's last transition in the stylesheet:
     fade begins at 2.8s and runs 1.1s. Ending the sequence any
     earlier is what made the doors stop mid-swing.            */
  const OPEN_MS = reduceMotion ? 750 : 3900;

  let opened = false;
  const open = async () => {
    if (opened) return;
    opened = true;
    cover.classList.add('is-open');
    try { await Music.play(); musicBtn.classList.remove('is-muted'); }
    catch { musicBtn.classList.add('is-muted'); }
    /* the controls arrive a little before the cover is gone, so
       they fade up over the last of it rather than popping in */
    /* langBtn is already visible from boot — only music arrives here */
    setTimeout(() => {
      musicBtn.classList.remove('is-hidden');
    }, Math.max(0, OPEN_MS - 900));
    setTimeout(() => {
      document.body.classList.remove('is-locked');
      observeReveals();
      cover.remove();
    }, OPEN_MS);
  };
  $('#openBtn').addEventListener('click', open);
  cover.addEventListener('click', open);

  musicBtn.addEventListener('click', () => {
    if (Music.playing){ Music.pause(); musicBtn.classList.add('is-muted'); }
    else { Music.resume(); musicBtn.classList.remove('is-muted'); }
  });
  langBtn.addEventListener('click', () =>
    applyLang(LANGS[(LANGS.indexOf(LANG) + 1) % LANGS.length]));

  /* redraw canvas art on resize / orientation change */
  let rt;
  addEventListener('resize', () => {
    clearTimeout(rt);
    rt = setTimeout(() => {
      if (!CONFIG.assets.cover && document.getElementById('coverArt')) drawCoverArt();
      if (!CONFIG.assets.hero) drawHeroArt();
      $$('.mini-map').forEach(cv => drawMiniMap(cv, +cv.dataset.seed));
    }, 220);
  }, { passive:true });
}

document.fonts?.ready.then(boot) ?? boot();
</script>
