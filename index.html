/* ================================================================
   Countdown
   ================================================================ */
function startCountdown(){
  const box = $('#countdown');
  const keys = ['days','hours','minutes','seconds'];
  box.innerHTML = keys.map(k =>
    `<div class="cell"><b data-k="${k}">00</b><span data-i18n="${k}">${t(k)}</span></div>`).join('');
  const out = {};
  keys.forEach(k => out[k] = box.querySelector(`[data-k="${k}"]`));

  const tick = () => {
    let ms = WEDDING - Date.now();
    if (ms <= 0){
      box.innerHTML = `<p class="body-line" style="grid-column:1/-1">${t('theDayIsHere')}</p>`;
      clearInterval(id); return;
    }
    const s = Math.floor(ms / 1000);
    const val = {
      days:    Math.floor(s / 86400),
      hours:   Math.floor(s % 86400 / 3600),
      minutes: Math.floor(s % 3600 / 60),
      seconds: s % 60
    };
    keys.forEach(k => out[k].textContent = String(val[k]).padStart(2, '0'));
  };
  const id = setInterval(tick, 1000);
  tick();
}

/* ================================================================
   Scratch to reveal
   ================================================================ */
function initScratch(){
  const cv = $('#scratchCanvas');
  const hint = $('#scratchHint');
  let ctx, dpr = 1, done = false, moves = 0, drawing = false, last = null;
  let autoFrame, autoScratching = false;

  function paint(){
    const r = cv.getBoundingClientRect();
    dpr = Math.min(devicePixelRatio || 1, 2);
    cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
    ctx = cv.getContext('2d', { willReadFrequently:true });
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const w = r.width, h = r.height;

    const g = ctx.createLinearGradient(0, 0, w, h);
    g.addColorStop(0,   '#f0cfd0');
    g.addColorStop(.42, '#e2adb1');
    g.addColorStop(1,   '#cf8f96');
    ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);

    /* a little foil shimmer so it reads as something to scratch */
    for (let i = 0; i < 140; i++){
      const x = ((i * 137) % 991) / 991 * w;
      const y = ((i * 79)  % 787) / 787 * h;
      ctx.fillStyle = i % 3 ? 'rgba(255,255,255,.30)' : 'rgba(216,164,65,.34)';
      ctx.beginPath(); ctx.arc(x, y, .8 + (i % 5) * .4, 0, 6.284); ctx.fill();
    }
    ctx.strokeStyle = 'rgba(255,255,255,.28)'; ctx.lineWidth = 1;
    for (let i = -h; i < w; i += 16){
      ctx.beginPath(); ctx.moveTo(i, h); ctx.lineTo(i + h, 0); ctx.stroke();
    }
    ctx.globalCompositeOperation = 'destination-out';
  }

  function erase(x, y){
    const R = 26;
    if (last){
      const dx = x - last.x, dy = y - last.y;
      const steps = Math.max(1, Math.hypot(dx, dy) / 7);
      for (let i = 0; i <= steps; i++){
        ctx.beginPath();
        ctx.arc(last.x + dx * i / steps, last.y + dy * i / steps, R, 0, 6.284);
        ctx.fill();
      }
    }
    ctx.beginPath(); ctx.arc(x, y, R, 0, 6.284); ctx.fill();
    last = { x, y };
  }

  function cleared(){
    const d = ctx.getImageData(0, 0, cv.width, cv.height).data;
    let gone = 0, total = 0;
    for (let i = 3; i < d.length; i += 4 * 24){ total++; if (d[i] < 32) gone++; }
    return total ? gone / total : 0;
  }

  function finish(celebrate = true){
    if (done) return;
    done = true;
    cv.classList.add('is-done');
    hint.classList.add('is-hidden');
    if (celebrate) burstFireworks($('#scratchWrap'));
  }

  function autoReveal(){
    if (done || drawing || autoScratching) return;
    autoScratching = true;
    const r = cv.getBoundingClientRect();
    const points = [];
    for (let row = 0; row < 8; row++){
      const y = r.height * (.18 + row * .09);
      for (let column = 0; column <= 20; column++){
        const progress = column / 20;
        const x = r.width * (row % 2 ? .88 - progress * .76 : .12 + progress * .76);
        points.push({ x, y });
      }
    }
    let drawn = 0;
    const started = performance.now();
    const scratch = now => {
      if (!autoScratching || done) return;
      const target = Math.min(points.length, Math.ceil(points.length * (now - started) / 2400));
      while (drawn < target){
        const point = points[drawn++];
        erase(point.x, point.y);
      }
      if (drawn < points.length){
        autoFrame = requestAnimationFrame(scratch);
      } else {
        autoScratching = false;
        last = null;
        finish(false);
      }
    };
    autoFrame = requestAnimationFrame(scratch);
  }

  const pos = e => {
    const r = cv.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  };
  cv.addEventListener('pointerdown', e => {
    if (done) return;
    if (autoScratching){
      autoScratching = false;
      cancelAnimationFrame(autoFrame);
    }
    drawing = true; last = null;
    cv.setPointerCapture?.(e.pointerId);
    const p = pos(e); erase(p.x, p.y);
  });
  cv.addEventListener('pointermove', e => {
    if (!drawing || done) return;
    e.preventDefault();
    const p = pos(e); erase(p.x, p.y);
    if (++moves % 9 === 0 && cleared() > .48) finish();
  });
  const up = () => {
    if (!drawing) return;
    drawing = false; last = null;
    if (!done && cleared() > .34) finish();
  };
  cv.addEventListener('pointerup', up);
  cv.addEventListener('pointercancel', up);
  cv.addEventListener('pointerleave', up);
  /* keyboard / reduced-motion path: one press reveals it */
  cv.tabIndex = 0;
  cv.setAttribute('aria-label', t('scratchHint'));
  cv.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); finish(); }
  });

  paint();
  addEventListener('resize', () => { if (!done) paint(); }, { passive:true });
  return { autoReveal };
}

/* ================================================================
   Confetti
   ================================================================ */
function burstFireworks(anchor){
  const cv = $('#confetti');
  const dpr = Math.min(devicePixelRatio || 1, 2);
  const w = Math.max(1, Math.round(innerWidth));
  const h = Math.max(1, Math.round(innerHeight));
  cv.width = w * dpr;
  cv.height = h * dpr;
  const ctx = cv.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const palette = ['#d8a441','#efcb86','#f3b9bd','#fff7f1','#8a413a'];
  const anchorRect = anchor.getBoundingClientRect();
  const anchorX = anchorRect.left + anchorRect.width / 2;
  const anchorY = Math.max(58, anchorRect.top + anchorRect.height * .16);
  const centers = [
    { x:w*.16, y:h*.12 }, { x:w*.5, y:h*.08 }, { x:w*.84, y:h*.12 },
    { x:w*.1,  y:h*.35 }, { x:anchorX, y:Math.min(h*.42, anchorY) }, { x:w*.9, y:h*.35 },
    { x:w*.18, y:h*.62 }, { x:w*.5, y:h*.58 }, { x:w*.82, y:h*.62 },
    { x:w*.28, y:h*.86 }, { x:w*.72, y:h*.86 }
  ];
  const sparks = [];
  centers.forEach((p, index) => {
    const count = reduceMotion ? 10 : 26;
    for (let i = 0; i < count; i++){
      const angle = i / count * 6.284 + index * .35;
      const speed = 2.2 + Math.random() * (reduceMotion ? 2 : 4.5);
      sparks.push({
        x:p.x, y:p.y, vx:Math.cos(angle)*speed, vy:Math.sin(angle)*speed,
        life:1, size:1.5 + Math.random()*2.5, color:palette[(i+index)%palette.length]
      });
    }
  });
  const pieces = Array.from({length:reduceMotion ? 20 : 90}, (_, i) => ({
    x:Math.random()*w, y:-Math.random()*h*.4, vx:(Math.random()-.5)*1.5,
    vy:1.5+Math.random()*3.5, size:2+Math.random()*4,
    rotation:Math.random()*6.284, spin:(Math.random()-.5)*.2,
    color:palette[i%palette.length], life:1
  }));
  let frame = 0;
  (function step(){
    ctx.clearRect(0, 0, w, h);
    let alive = false;
    sparks.forEach(s => {
      if (s.life <= 0) return;
      alive = true; s.x += s.vx; s.y += s.vy; s.vy += .035; s.vx *= .985; s.life -= .014;
      ctx.globalAlpha = Math.max(0, s.life);
      ctx.fillStyle = s.color; ctx.beginPath(); ctx.arc(s.x, s.y, s.size, 0, 6.284); ctx.fill();
    });
    pieces.forEach(p => {
      if (p.life <= 0) return;
      alive = true; p.x += p.vx; p.y += p.vy; p.rotation += p.spin; p.life -= .006;
      ctx.save(); ctx.globalAlpha = Math.max(0, Math.min(1, p.life*1.5));
      ctx.translate(p.x,p.y); ctx.rotate(p.rotation); ctx.fillStyle = p.color;
      ctx.fillRect(-p.size/2,-p.size/3,p.size,p.size*.66); ctx.restore();
    });
    ctx.globalAlpha = 1;
    if (alive && frame++ < (reduceMotion ? 70 : 180)) requestAnimationFrame(step);
    else ctx.clearRect(0, 0, w, h);
  })();
}

function burstConfetti(anchor){
  const cv = $('#confetti');
  const { ctx, w, h } = fitCanvas(cv);
  const r = anchor.getBoundingClientRect();
  const ox = r.left + r.width / 2, oy = r.top + r.height / 2;
  const colors = ['#d8a441','#6b211c','#e2adb1','#fdf7f3','#8a413a','#efcb86'];
  const N = reduceMotion ? 40 : 130;

  const bits = Array.from({ length: N }, (_, i) => {
    const a = (i / N) * 6.284 + Math.random() * .5;
    const sp = 3 + Math.random() * 8;
    return {
      x: ox + (Math.random() - .5) * r.width * .5,
      y: oy + (Math.random() - .5) * r.height * .4,
      vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 4,
      s: 3 + Math.random() * 5, rot: Math.random() * 6.284,
      vr: (Math.random() - .5) * .28,
      c: colors[i % colors.length], heart: i % 5 === 0, life: 1
    };
  });

  let raf;
  (function step(){
    ctx.clearRect(0, 0, w, h);
    let alive = 0;
    bits.forEach(b => {
      if (b.life <= 0) return;
      alive++;
      b.vy += .19; b.vx *= .992;
      b.x += b.vx; b.y += b.vy; b.rot += b.vr;
      b.life -= .0072;
      ctx.save();
      ctx.globalAlpha = Math.max(0, Math.min(1, b.life * 1.5));
      ctx.translate(b.x, b.y); ctx.rotate(b.rot);
      ctx.fillStyle = b.c;
      if (b.heart){
        const k = b.s / 46;
        ctx.scale(k, k); ctx.translate(-50, -43);
        ctx.fill(new Path2D('M50,84 C22,64 4,45 4,27 C4,13 15,4 27,4 C37,4 45,10 50,18 C55,10 63,4 73,4 C85,4 96,13 96,27 C96,45 78,64 50,84 Z'));
      } else {
        ctx.fillRect(-b.s / 2, -b.s / 4, b.s, b.s / 2);
      }
      ctx.restore();
    });
    if (alive) raf = requestAnimationFrame(step);
    else { ctx.clearRect(0, 0, w, h); cancelAnimationFrame(raf); }
  })();
}

/* ================================================================
   Music — your song if you gave one, otherwise an original
   sitar-and-dholak arrangement
   ================================================================ */
const Music = (() => {
  let audio = null, actx = null, master = null, timer = null, playing = false, usingFile = false;

  function useFile(){
    audio = new Audio(CONFIG.assets.song);
    audio.loop = true; audio.preload = 'auto'; audio.volume = 0;
    return audio;
  }

  function fade(target, ms){
    if (!audio) return;
    const from = audio.volume, t0 = performance.now();
    (function s(){
      const k = Math.min(1, (performance.now() - t0) / ms);
      audio.volume = from + (target - from) * k;
      if (k < 1) requestAnimationFrame(s);
    })();
  }

  let noiseBuf = null;
  function getNoiseBuffer(){
    if (!noiseBuf){
      const len = actx.sampleRate * .3;
      noiseBuf = actx.createBuffer(1, len, actx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    }
    return noiseBuf;
  }

  /* a plucked "sitar" voice: a fast slide into the note, light
     vibrato, and a softly bandpassed tone — rounder than a raw
     sawtooth, so it sits underneath the melody rather than buzzing */
  function sitarNote(f, t, dur){
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = 'triangle';
    o.frequency.setValueAtTime(f * 1.03, t);
    o.frequency.exponentialRampToValueAtTime(f, t + .09);
    const lfo = actx.createOscillator(), lfoGain = actx.createGain();
    lfo.type = 'sine'; lfo.frequency.value = 5; lfoGain.gain.value = f * .004;
    lfo.connect(lfoGain); lfoGain.connect(o.frequency);
    const bp = actx.createBiquadFilter();
    bp.type = 'bandpass'; bp.frequency.value = f * 2; bp.Q.value = 1.6;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(.16, t + .02);
    g.gain.exponentialRampToValueAtTime(.0006, t + dur);
    o.connect(bp); bp.connect(g); g.connect(master);
    o.start(t); lfo.start(t);
    o.stop(t + dur + .12); lfo.stop(t + dur + .12);
  }

  /* two hand-drum voices for a light dholak-style pulse — kept soft
     and low in the mix so it supports the melody, not overpowering */
  function tablaHit(t, low){
    const noise = actx.createBufferSource();
    noise.buffer = getNoiseBuffer();
    const bp = actx.createBiquadFilter();
    bp.type = low ? 'lowpass' : 'bandpass';
    bp.frequency.value = low ? 220 : 1600;
    if (!low) bp.Q.value = 2.2;
    const g = actx.createGain();
    g.gain.setValueAtTime(low ? .2 : .08, t);
    g.gain.exponentialRampToValueAtTime(.0006, t + (low ? .24 : .1));
    noise.connect(bp); bp.connect(g); g.connect(master);
    noise.start(t); noise.stop(t + .3);
    if (low){
      const o = actx.createOscillator(), og = actx.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(100, t);
      o.frequency.exponentialRampToValueAtTime(52, t + .2);
      og.gain.setValueAtTime(.16, t);
      og.gain.exponentialRampToValueAtTime(.0006, t + .24);
      o.connect(og); og.connect(master);
      o.start(t); o.stop(t + .26);
    }
  }

  /* an original ~36s arrangement — pad chords, a tanpura-style
     drone, a dholak pulse and a sitar melody, scheduled ahead
     and looped                                                   */
  function scheduleLoop(startTime){
    const LOOP = 36;
    const chords = [
      [146.83,185.00,220.00], [110.00,138.59,164.81],
      [123.47,146.83,185.00], [98.00,123.47,146.83],
      [146.83,185.00,220.00], [110.00,138.59,164.81],
      [98.00,123.47,146.83],  [110.00,138.59,164.81]
    ];
    const CHORD_LEN = LOOP / chords.length;
    chords.forEach((tones, i) => {
      const t0 = startTime + i * CHORD_LEN;
      tones.forEach((f, j) => {
        const o = actx.createOscillator(), g = actx.createGain();
        o.type = j === 0 ? 'triangle' : 'sine'; o.frequency.value = f;
        const peak = j === 0 ? .045 : .03;
        g.gain.setValueAtTime(0, t0);
        g.gain.linearRampToValueAtTime(peak, t0 + 1.2);
        g.gain.setValueAtTime(peak, t0 + CHORD_LEN - 1.4);
        g.gain.linearRampToValueAtTime(0, t0 + CHORD_LEN);
        o.connect(g); g.connect(master);
        o.start(t0); o.stop(t0 + CHORD_LEN + .05);
      });
    });

    [73.42, 110.00].forEach((f, i) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0, startTime);
      g.gain.linearRampToValueAtTime(i ? .02 : .028, startTime + 2.4);
      g.gain.setValueAtTime(i ? .02 : .028, startTime + LOOP - 2);
      g.gain.linearRampToValueAtTime(0, startTime + LOOP);
      o.connect(g); g.connect(master);
      o.start(startTime); o.stop(startTime + LOOP + .05);
    });

    for (let c = 0; c * 1.5 < LOOP; c++){
      const cellStart = startTime + c * 1.5;
      tablaHit(cellStart, true);
      tablaHit(cellStart + .5, false);
      tablaHit(cellStart + 1.0, false);
      tablaHit(cellStart + 1.25, false);
    }

    const scale = [293.66,329.63,369.99,440.00,493.88,587.33,659.25,739.99,880.00];
    const playPhrase = (phrase, from, beat) => {
      let t = from;
      phrase.forEach(([idx, len]) => {
        const dur = len * beat;
        sitarNote(scale[idx], t, dur);
        t += dur;
      });
    };
    playPhrase([[2,1],[3,1],[4,.5],[3,.5],[2,1],[1,1],[0,2],
                [2,1],[3,1],[4,.5],[5,.5],[4,1],[3,1],[2,2]], startTime + 3.2, .62);
    playPhrase([[3,1],[4,1],[5,.5],[4,.5],[3,1],[2,1],[1,2],
                [3,1],[4,1],[5,.5],[6,.5],[5,1],[4,1],[3,2]], startTime + 19.6, .58);

    [24.5, 24.66, 24.82, 30.4, 30.56].forEach((off, k) => {
      const t = startTime + off;
      const idx = [7,8,7,6,7][k];
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = 'sine'; o.frequency.value = scale[idx] * 1.5;
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(.05, t + .008);
      g.gain.exponentialRampToValueAtTime(.0006, t + .5);
      o.connect(g); g.connect(master);
      o.start(t); o.stop(t + .55);
    });
  }

  /* a short synthetic tail so the mix reads as one room, not a
     pile of dry, disconnected samples                            */
  function makeImpulse(){
    const len = actx.sampleRate * 1.6;
    const buf = actx.createBuffer(2, len, actx.sampleRate);
    for (let ch = 0; ch < 2; ch++){
      const d = buf.getChannelData(ch);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.6);
    }
    return buf;
  }

  function startSynth(){
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (!master){
      master = actx.createGain();
      master.gain.value = 0;
      const lp = actx.createBiquadFilter();
      lp.type = 'lowpass'; lp.frequency.value = 4200;
      const comp = actx.createDynamicsCompressor();
      comp.threshold.value = -20; comp.knee.value = 26; comp.ratio.value = 3.2;
      comp.attack.value = .01; comp.release.value = .28;
      const verbSend = actx.createGain();
      verbSend.gain.value = .22;
      const verb = actx.createConvolver();
      verb.buffer = makeImpulse();
      master.connect(lp);
      lp.connect(comp);
      lp.connect(verbSend); verbSend.connect(verb); verb.connect(comp);
      comp.connect(actx.destination);
    }
    master.gain.cancelScheduledValues(actx.currentTime);
    master.gain.linearRampToValueAtTime(.48, actx.currentTime + 2.2);

    clearTimeout(timer);
    const LOOP = 36;
    const kickOff = start => {
      scheduleLoop(start);
      timer = setTimeout(() => kickOff(start + LOOP), (LOOP - 1.5) * 1000);
    };
    kickOff(actx.currentTime + .05);
  }

  return {
    available(){ return true; },
    async play(){
      if (playing) return;
      playing = true;
      (audio || useFile());
      try { await audio.play(); fade(.55, 2200); }
      catch { playing = false; throw new Error('blocked'); }
    },
    pause(){
      playing = false;
      if (audio) { fade(0, 500); setTimeout(() => audio && audio.pause(), 520); }
      clearTimeout(timer);
    },
    resume(){
      playing = true;
      if (audio) { audio.play().catch(() => {}); fade(.55, 900); }
    },
    get playing(){ return playing; }
  };
})();

/* ================================================================
   RSVP
   ================================================================ */
const GFORM_ACTION = id => `https://docs.google.com/forms/d/e/${id}/formResponse`;

/* Is the Google Form wired up enough to try? */
function gformReady(){
  const g = CONFIG.rsvp?.googleForm;
  return !!(g && g.formId && g.entries && g.entries.name && g.entries.attending);
}

/* Google's answers, keyed the way Google wants them. */
function gformBody(d){
  const g = CONFIG.rsvp.googleForm, p = new URLSearchParams();
  const put = (id, val) => { if (id && val !== '' && val != null) p.append(`entry.${String(id).replace(/\D/g,'')}`, val); };
  put(g.entries.name,      d.name);
  put(g.entries.email,     d.email);
  put(g.entries.guests,    d.guests);
  put(g.entries.attending, d.attending === 'yes' ? g.attendingYes : g.attendingNo);
  put(g.entries.message,   d.message);
  /* Google's own email field, only when the form collects it */
  if (g.collectsEmail && d.email) p.append('emailAddress', d.email);
  /* keeps single-page forms happy */
  p.append('fvv', '1'); p.append('pageHistory', '0'); p.append('submit', 'Submit');
  return p;
}

/* Plan A: a quiet cross-origin POST. Google sends no CORS headers,
   so the reply is opaque — a resolved promise means "delivered",
   not "accepted". That is as good as it gets without a backend. */
async function gformFetch(d){
  await fetch(GFORM_ACTION(CONFIG.rsvp.googleForm.formId), {
    method: 'POST',
    mode: 'no-cors',
    body: gformBody(d)          // urlencoded → a CORS-safelisted request
  });
}

/* Plan B: an old-fashioned form POST into a hidden iframe.
   Survives environments where fetch is walled off. */
function gformIframe(d){
  return new Promise((resolve, reject) => {
    let sink = document.getElementById('gformSink');
    if (!sink){
      sink = el('iframe');
      sink.id = 'gformSink'; sink.name = 'gformSink';
      sink.style.cssText = 'position:absolute;width:0;height:0;border:0;left:-9999px';
      document.body.appendChild(sink);
    }
    const f = el('form');
    f.action = GFORM_ACTION(CONFIG.rsvp.googleForm.formId);
    f.method = 'POST'; f.target = 'gformSink';
    f.style.display = 'none';
    for (const [k, val] of gformBody(d)){
      const i = el('input'); i.type = 'hidden'; i.name = k; i.value = val;
      f.appendChild(i);
    }
    document.body.appendChild(f);
    const done = setTimeout(() => { f.remove(); resolve(); }, 1400);
    sink.addEventListener('load', () => { clearTimeout(done); f.remove(); resolve(); }, { once:true });
    try { f.submit(); } catch (err){ clearTimeout(done); f.remove(); reject(err); }
  });
}

/* Last resort: the submit never reached Google, so tell the guest
   where to send it by hand.

   Deliberately plain text, not a wa.me / mailto: link. Two reasons:
   the number and address then aren't sitting in the markup as
   harvestable hrefs, and window.open() from here was unreliable
   anyway — by the time an awaited fetch has failed the user gesture
   has expired, so mobile popup blockers ate it.                   */
function handoffText(){
  const wa = (CONFIG.rsvp?.whatsApp || '').replace(/\D/g, '');
  if (wa) return `${t('formFailWa')} ${prettyPhone(wa)}`;
  const em = CONFIG.rsvp?.email || '';
  if (em) return `${t('formFailEmail')} ${em}`;
  return '';
}

/* 919748609947 → +91 97486 09947. Any shape we don't recognise is
   shown as-is with a leading +, rather than mangled.              */
function prettyPhone(digits){
  const m = /^(\d{2})(\d{5})(\d{5})$/.exec(digits);
  return m ? `+${m[1]} ${m[2]} ${m[3]}` : `+${digits}`;
}

function initRsvp(){
  const form   = $('#rsvpForm'),
        note   = $('#formNote'),
        thanks = $('#thanks'),
        btn    = form.querySelector('.submit');

  if (CONFIG.rsvp?.googleForm?.formId && !gformReady()){
    console.warn('[RSVP] formId is set but entries.name / entries.attending are empty — ' +
                 'falling back to WhatsApp/email. See CONFIG section 7, step 3.');
  }

  const succeed = attending => {
    form.classList.add('is-off');
    thanks.classList.add('is-on');
    if (attending === 'yes') burstConfetti(thanks);
  };

  form.addEventListener('submit', async e => {
    e.preventDefault();
    const f = new FormData(form);
    const d = {
      name:      (f.get('name')    || '').toString().trim(),
      email:     (f.get('email')   || '').toString().trim(),
      guests:    (f.get('guests')  || '').toString().trim(),
      attending: (f.get('attending')|| '').toString(),
      message:   (f.get('message') || '').toString().trim()
    };

    if (!d.name || !d.attending){
      note.textContent = t('formErr');
      note.style.color = 'var(--oxblood)';
      return;
    }

    /* no Google Form configured → nothing can be recorded, so point
       the guest at WhatsApp and leave the form up. Deliberately not
       succeed(): "thank you" would be a lie, and it hides the form
       (and this note with it, since #formNote lives inside it).    */
    if (!gformReady()){
      note.textContent = `${t('formFail')} ${handoffText()}`.trim();
      note.style.color = 'var(--oxblood)';
      return;
    }

    btn.disabled = true;
    btn.textContent = t('fSending');
    note.textContent = '';

    try {
      try { await gformFetch(d); }
      catch { await gformIframe(d); }
      succeed(d.attending);
    } catch (err){
      console.error('[RSVP] Google Form submit failed:', err);
      note.textContent = `${t('formFail')} ${handoffText()}`.trim();
      note.style.color = 'var(--oxblood)';
      /* No succeed() here on purpose. The reply did NOT reach us, so
         the form stays on screen with what the guest typed intact,
         ready to retry — and the note above stays visible.          */
    } finally {
      btn.disabled = false;
      btn.textContent = t('fSend');
    }
  });
}

/* ================================================================
   Reveal on scroll
   ================================================================ */
let io;
function observeReveals(root = document){
  if (reduceMotion){ $$('.reveal', root).forEach(n => n.classList.add('in')); return; }
  io = io || new IntersectionObserver(entries => {
    entries.forEach(en => {
      if (en.isIntersecting){ en.target.classList.add('in'); io.unobserve(en.target); }
    });
  }, { rootMargin:'0px 0px -12% 0px', threshold:.15 });
  $$('.reveal', root).forEach(n => io.observe(n));
}

/* ================================================================
   Language
   ================================================================ */
function applyLang(next){
  LANG = LANGS.includes(next) ? next : 'en';
  document.documentElement.lang = LANG;
  /* one hook for "this page is not in a Latin script right now" */
  document.documentElement.classList.toggle('indic', LANG !== 'en');
  $$('[data-i18n]').forEach(n => n.textContent = t(n.dataset.i18n));
  $$('[data-i18n-ph]').forEach(n => n.placeholder = t(n.dataset.i18nPh));
  $('#scratchCanvas').setAttribute('aria-label', t('scratchHint'));
  $('#langLabel').textContent = t('langOther');
  renderStatic();
  renderTimeline();
  renderVenues();
  observeReveals();
}

/* ================================================================
   Boot
   ================================================================ */
function boot(){
  paintIcons(); paintRules();

  /* gate + bow art */
  $('#gateL').innerHTML = gateSvg('l');
  $('#gateR').innerHTML = gateSvg('r');
  $('#gateBow').innerHTML = bowSvg();
  $('#nicheFrame').innerHTML = nicheSvg();
  $('#heroFrame').innerHTML = heroFrameSvg();

  /* What goes in the niche: your image wins, then the drawn
     idol, then the ॐ glyph.                                */
  const niche = $('.niche'), art = $('#nicheArt'), idol = $('#nicheIdol');
  if (CONFIG.assets.ganesha){
    niche.classList.add('has-art');
    art.classList.remove('is-glyph');
    art.style.backgroundImage = `url("${CONFIG.assets.ganesha}")`;
  } else if (CONFIG.ganeshaStyle === 'om'){
    niche.classList.add('has-art');
    art.innerHTML = '<span class="om" aria-hidden="true">ॐ</span>';
  } else {
    niche.classList.add('has-idol');
    idol.innerHTML = ganeshaSvg();
  }

  /* your files, or drawn stand-ins */
  const A = CONFIG.assets;
  const coverVideoEl = $('#coverVideo');
  if (A.coverVideo){
    const poster = $('#coverPhoto');
    poster.hidden = false;
    poster.style.backgroundImage = `url("${A.openingPoster || A.cover}")`;
    coverVideoEl.src = A.coverVideo;
    coverVideoEl.hidden = false;
    $('#cover').classList.add('has-cover-video');
    $('#coverArt').hidden = true;
  } else if (A.cover){
    const n = $('#coverPhoto');
    n.hidden = false;
    n.style.backgroundImage = `url("${A.cover}")`;
    n.style.setProperty('--front-page-image', `url("${A.cover}")`);
    $('#cover').classList.add('has-cover-image');
    $('#coverArt').hidden = true;
  }
  else drawCoverArt();

  if (A.hero){
    const n = $('#heroPhoto');
    n.hidden = false;
    n.style.backgroundImage = `url("${A.hero}")`;
    $('#hero').classList.add('has-hero-image');
    $('#heroArt').hidden = true;
  }
  else drawHeroArt();

  applyLang(LANG);
  $('#langBtn').classList.remove('is-hidden');

  startCountdown();
  const scratch = initScratch();
  initRsvp();

  /* keep the page still behind the closed gate */
  document.body.classList.add('is-locked');

  /* --- open the gate ------------------------------------- */
  const cover = $('#cover'), musicBtn = $('#musicBtn'), langBtn = $('#langBtn'), coverVideo = $('#coverVideo');

  const scrollCue = $('.scroll-cue');
  const syncScrollCue = () => scrollCue.classList.toggle('is-scrolled', scrollY > 24);
  addEventListener('scroll', syncScrollCue, { passive:true });
  syncScrollCue();

      /* Match the cover's final fade and the bow-opening motion. */
      const OPEN_MS = reduceMotion ? 750 : 3900;

  /* The browser UI can't be removed, so tint it to match instead:
     dark behind the cover, the page's warm ground afterwards.     */
  const setThemeColor = c => {
    const m = document.querySelector('meta[name="theme-color"]');
    if (m) m.setAttribute('content', c);
  };

  let opened = false;
  let finishTimer;
  let guidedScrollTimer;
  let guidedScrollFrame;
  let guidedScrollStopped = false;
  const guidedScrollEvents = ['wheel', 'touchstart', 'pointerdown'];
  const stopGuidedScroll = () => {
    guidedScrollStopped = true;
    clearTimeout(guidedScrollTimer);
    cancelAnimationFrame(guidedScrollFrame);
    guidedScrollEvents.forEach(type => removeEventListener(type, stopGuidedScroll));
    removeEventListener('keydown', stopGuidedScrollOnKey);
  };
  const stopGuidedScrollOnKey = event => {
    if (['ArrowDown', 'ArrowUp', 'PageDown', 'PageUp', 'Home', 'End', ' '].includes(event.key)){
      stopGuidedScroll();
    }
  };
  const startGuidedScroll = () => {
    if (reduceMotion || guidedScrollStopped) return;
    guidedScrollEvents.forEach(type => addEventListener(type, stopGuidedScroll, { passive:true }));
    addEventListener('keydown', stopGuidedScrollOnKey);
    guidedScrollTimer = setTimeout(() => {
      let previousTime = performance.now();
      const step = currentTime => {
        if (guidedScrollStopped) return;
        const distance = 26 * Math.min(currentTime - previousTime, 50) / 1000;
        previousTime = currentTime;
        scrollBy(0, distance);
        const scratchRect = $('#scratchWrap').getBoundingClientRect();
        if (scratchRect.top < innerHeight * .78 && scratchRect.bottom > innerHeight * .2){
          scratch.autoReveal();
        }
        if (scrollY + innerHeight >= document.documentElement.scrollHeight - 1){
          stopGuidedScroll();
          return;
        }
        guidedScrollFrame = requestAnimationFrame(step);
      };
      guidedScrollFrame = requestAnimationFrame(step);
    }, 4500);
  };
  const finishOpen = () => {
    if (!cover.isConnected) return;
    $('#hero').classList.add('intro-active');
    document.body.classList.remove('is-locked');
    observeReveals();
    cover.remove();
    musicBtn.classList.remove('is-hidden');
    setThemeColor('#efd9d7');
    startGuidedScroll();
  };
  const startFallbackOpen = () => {
    cover.classList.add('is-open');
    clearTimeout(finishTimer);
    finishTimer = setTimeout(finishOpen, OPEN_MS);
  };
  const showCoverImage = () => {
    const fallback = $('#coverPhoto');
    cover.classList.remove('has-cover-video', 'is-playing');
    cover.classList.add('has-cover-image');
    coverVideo.hidden = true;
    fallback.hidden = false;
    fallback.style.backgroundImage = `url("${A.cover}")`;
  };
  const open = async () => {
    if (opened) return;
    opened = true;

    /* Real fullscreen where it's permitted. This has to fire inside
       the tap's gesture window — hence before any await below — and
       it is best-effort by design: iPhone Safari has no element
       fullscreen at all, and an in-app webview may refuse. Both
       cases no-op silently rather than breaking the open.        */
    try {
      const el = document.documentElement;
      if (el.requestFullscreen) el.requestFullscreen({ navigationUI: 'hide' })?.catch(() => {});
      else el.webkitRequestFullscreen?.();   /* older iPad Safari */
    } catch {}

    if (cover.classList.contains('has-cover-video') && coverVideo?.src){
      cover.classList.add('is-playing');
      coverVideo.currentTime = 0;
      coverVideo.play().catch(() => {
        showCoverImage();
        startFallbackOpen();
      });
    } else startFallbackOpen();

    try { await Music.play(); musicBtn.classList.remove('is-muted'); }
    catch { musicBtn.classList.add('is-muted'); }
  };

  $('#openBtn').addEventListener('click', open);
  cover.addEventListener('click', open);

  if (coverVideo?.src){
    coverVideo.addEventListener('error', () => {
      showCoverImage();
      if (opened) startFallbackOpen();
    }, { once:true });
    coverVideo.addEventListener('ended', () => {
      coverVideo.hidden = true;
      finishOpen();
    }, { once:true });
  }

  musicBtn.addEventListener('click', () => {
    if (Music.playing){ Music.pause(); musicBtn.classList.add('is-muted'); }
    else { Music.resume(); musicBtn.classList.remove('is-muted'); }
  });
  langBtn.addEventListener('click', () =>
    applyLang(LANGS[(LANGS.indexOf(LANG) + 1) % LANGS.length]));

  /* redraw canvas art on resize / orientation change */
  let rt;
  addEventListener('resize', () => {
    clearTimeout(rt);
    rt = setTimeout(() => {
      if (!CONFIG.assets.cover && document.getElementById('coverArt')) drawCoverArt();
      if (!CONFIG.assets.hero) drawHeroArt();
      $$('.mini-map').forEach(cv => drawMiniMap(cv, +cv.dataset.seed));
    }, 220);
  }, { passive:true });
}

document.fonts?.ready.then(boot) ?? boot();
</script>
