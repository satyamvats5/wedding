<!DOCTYPE html>
<meta charset="utf-8">
<title>TaniaWedsSatyam</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<!-- Tints the browser's own toolbars to match the page. Starts dark
     for the cover; JS swaps it to the warm ground when the doors
     open. Can't remove the chrome (nothing can, least of all inside
     WhatsApp's in-app browser) but it stops looking like chrome. -->
<meta name="theme-color" content="#070b1c">
<meta name="robots" content="noindex, nofollow">
<meta name="googlebot" content="noindex, nofollow">


<!-- Link preview (WhatsApp, iMessage, Signal, …).
     Deliberately says nothing: no names, no date, no venue — so the
     card gives away no more than the bare URL did, and needs no
     update when the real details go in.

     No og:image on purpose — a preview image would have to be a real
     file at an absolute URL, which means committing the couple's
     names or photo as a public, permanently-cached asset.

     No og:url either: leaving it out lets the sharer's actual URL
     stand, so this survives a later move to a custom domain. -->
<meta property="og:type"        content="website">
<meta property="og:title"       content="💌 You're Invited">
<meta property="og:description" content="Tap to open the invitation ✨">
<meta name="twitter:card"       content="summary">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Parisienne&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Tiro+Devanagari+Sanskrit:ital@0;1&family=Tiro+Bangla:ital@0;1&display=swap">

<style>
/* ============================================================
   MOONLIT VOWS — wedding invitation
   Everything you need to change lives in the CONFIG block
   at the top of the script at the bottom of this file.
   ============================================================ */

:root{
  /* --- ink & ground --------------------------------------- */
  --night:        #101733;
  --night-deep:   #070b1c;
  --night-haze:   #2a2f52;
  --blush:        #f3dcda;
  --blush-soft:   #faede8;
  --cream:        #fdf7f3;
  /* --- type colours --------------------------------------- */
  --oxblood:      #6b211c;
  --oxblood-soft: #8a413a;
  --rose-ink:     #8a5f59;
  --gold:         #d8a441;
  --gold-pale:    #efcb86;
  --ivory:        #f6ece2;
  /* --- festive accents, used sparingly for celebration touches - */
  --festive-pink:   #c23670;
  --festive-orange: #e07a3f;
  --festive-teal:   #2f7a6b;
  /* --- structure ------------------------------------------ */
  --line:         rgba(107,33,28,.16);
  --line-soft:    rgba(107,33,28,.09);
  --shade:        rgba(107,33,28,.06);

  --f-name:   'Great Vibes', 'Segoe Script', cursive;
  --f-script: 'Parisienne', 'Great Vibes', cursive;
  --f-serif:  'EB Garamond', Georgia, 'Times New Roman', serif;
  --f-deva:   'Tiro Devanagari Sanskrit', 'Noto Serif Devanagari', Georgia, serif;
  --f-bangla: 'Tiro Bangla', 'Noto Serif Bengali', Georgia, serif;
  /* every script the language switcher can land on, for buttons
     whose label is written in the language they switch TO      */
  --f-any:    'EB Garamond', 'Tiro Devanagari Sanskrit', 'Tiro Bangla',
              'Noto Serif Devanagari', 'Noto Serif Bengali', Georgia, serif;

  --col: 480px;          /* the phone-width content column */
  --pad: clamp(22px, 6.5vw, 34px);
}

*,*::before,*::after{ box-sizing:border-box; }

body{
  margin:0;
  background:
    radial-gradient(120% 80% at 50% 0%, #efd9d7 0%, #e4c8c8 45%, #d8b9bb 100%)
    fixed;
  color:var(--oxblood);
  font-family:var(--f-serif);
  font-size:17px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
/* dvh, not vh: on mobile 100vh is the *tall* viewport and ignores the
   visible URL bar, which made the cover overflow the screen. */
body.is-locked{ overflow:hidden; height:100vh; height:100dvh; }

img,svg,canvas{ display:block; max-width:100%; }
button{ font:inherit; color:inherit; }

:focus-visible{
  outline:2px solid var(--gold);
  outline-offset:3px;
  border-radius:3px;
}

/* ---------- the column ------------------------------------ */
.site{
  width:min(100%, var(--col));
  margin-inline:auto;
  position:relative;
  background:var(--blush);
  box-shadow:0 0 90px rgba(74,20,24,.28);
  overflow:clip;
}

/* ============================================================
   1 · GATE COVER
   ============================================================ */
/* ------------------------------------------------------------
   The opening sequence. Every step is a CSS transition delay so
   the whole thing stays on one clock; OPEN_MS in the script is
   the only number that has to agree with it.

     0.00s  "tap to open" fades
     0.00s  doors begin their swing (2.2s, right lags 0.09s)
     0.00s  the bow drops away
     0.50s  the cover's backdrop dissolves — from here you are
            watching the doors open onto the real night sky
     1.00s  the Ganesha niche lifts and fades
     2.29s  doors fully open · a beat to look through them
     2.80s  the cover itself fades out (1.1s)
     3.90s  cover removed, page unlocked
   ------------------------------------------------------------ */
.cover{
  position:fixed; inset:0; z-index:70;
  display:grid; place-items:center;
  background-color:#d9c0bc;
  overflow:hidden;
  transition:background-color 1.5s ease .5s,
             opacity 1.1s ease 2.8s,
             visibility 1.1s ease 2.8s;
}
/* letting the ground go transparent is what reveals the hero
   through the widening gap between the doors */
.cover.is-open{
  background-color:transparent;
  opacity:0; visibility:hidden; pointer-events:none;
}

.cover-stage{
  position:relative;
  width:min(100%, var(--col)); height:100%;
  overflow:hidden;
  background:#d9c0bc;
  transition:transform 3.9s cubic-bezier(.3,.05,.3,1);
}
/* a slow push forward, as though stepping through the gate */
.cover.is-open .cover-stage{ transform:scale(1.08); }

/* your own cover photo, when ASSETS.cover is set */
.cover-photo,
#coverArt{
  position:absolute; inset:0;
  transition:opacity 1.5s ease .5s;
}
.cover-photo{ background-size:cover; background-position:center; }
#coverArt{ width:100%; height:100%; }
.cover-video{
  position:absolute; inset:0;
  width:100%; height:100%;
  object-fit:cover;
  object-position:center center;
  background:#d9c0bc;
  opacity:0;
  transition:opacity .55s ease;
}
.cover.has-cover-video.is-playing .cover-video{ opacity:1; }
.cover.has-cover-video .cover-photo{
  display:block;
  opacity:1;
  filter:blur(3px) brightness(.82);
  transform:scale(1.025);
  animation:openingPosterZoom 7s ease-in-out infinite alternate;
  transition:opacity .55s ease, filter .55s ease, transform .8s ease;
}
.cover.has-cover-video.is-playing .cover-photo{
  opacity:0;
  filter:blur(0) brightness(1);
  transform:scale(1.06);
  animation:none;
}
@keyframes openingPosterZoom{
  from{ transform:scale(1.025); }
  to{ transform:scale(1.09); }
}
.cover.has-cover-video #coverArt,
.cover.has-cover-video .gate,
.cover.has-cover-video .gate-bow,
.cover.has-cover-video .ganesha{ display:none; }
.cover.has-cover-video .cover-cta{ z-index:8; }
.cover.is-playing .cover-cta{ opacity:0; pointer-events:none; }
.cover.has-cover-video.is-open .cover-video{ opacity:0; }
.cover.has-cover-image .gate,
.cover.has-cover-image .gate-bow,
.cover.has-cover-image .ganesha{ display:none; }
.cover.has-cover-image .cover-photo{
  display:block;
  background-image:url("assets/firstpage.png") !important;
  background-size:cover;
  background-position:center;
  opacity:1;
  transition:opacity .2s ease 1.7s, transform 3.9s cubic-bezier(.3,.05,.3,1);
}
.cover.has-cover-image .cover-photo::before,
.cover.has-cover-image .cover-photo::after{
  content:'';
  position:absolute; inset:0;
  background-image:url("assets/firstpage.png");
  background-size:100% 100%;
  transition:transform 2.2s cubic-bezier(.25,.7,.2,1) .2s;
  will-change:transform;
}
.cover.has-cover-image .cover-photo::before{
  clip-path:inset(0 50% 0 0);
  background-position:left center;
  transform-origin:left center;
}
.cover.has-cover-image .cover-photo::after{
  clip-path:inset(0 0 0 50%);
  background-position:right center;
  transform-origin:right center;
}
.cover.has-cover-image.is-open .cover-photo::before{ transform:translateX(-48%); }
.cover.has-cover-image.is-open .cover-photo::after{ transform:translateX(48%); }
.cover.has-cover-image.is-open .cover-photo{ opacity:0; }
.cover.is-open .cover-photo,
.cover.is-open #coverArt{ opacity:0; }

.cover-vignette{
  position:absolute; inset:0;
  background:
    radial-gradient(75% 60% at 50% 40%, transparent 30%, rgba(95,54,53,.2) 100%),
    linear-gradient(to bottom, rgba(95,54,53,.1) 0%, transparent 28%, rgba(76,42,42,.24) 100%);
  transition:opacity 1.5s ease .5s;
}
.cover.is-open .cover-vignette{ opacity:0; }

/* the two swinging gate halves */
.gate{
  position:absolute; inset:0;
  perspective:1400px; perspective-origin:50% 45%;
}
.gate-half{
  position:absolute; top:0; bottom:0; width:50.4%;
  /* heavy doors: slow to start, then easing open */
  transition:transform 2.2s cubic-bezier(.34,.05,.2,1);
  will-change:transform;
  backface-visibility:hidden;
}
.gate-half svg{ width:100%; height:100%; }
.gate-half.l{ left:0;  transform-origin:left center;  }
/* the right leaf lags a fraction — hand-pushed, not mechanical */
.gate-half.r{ right:0; transform-origin:right center; transition-delay:.09s; }
.cover.is-open .gate-half.l{ transform:rotateY(-104deg); }
.cover.is-open .gate-half.r{ transform:rotateY( 104deg); }

.gate-bow{
  position:absolute; left:50%; top:52%;
  width:min(78%, 360px); translate:-50% -50%;
  overflow:visible;
  transition:transform 1.8s cubic-bezier(.25,.7,.2,1) .2s;
  filter:drop-shadow(0 8px 14px rgba(90,55,51,.28));
}
.cover.is-open .gate-bow{
  transform:translateY(18px) scale(.98);
}
.gate-bow .bow-left,
.gate-bow .bow-right,
.gate-bow .bow-tail-left,
.gate-bow .bow-tail-right{
  transition:transform 1.8s cubic-bezier(.25,.7,.2,1) .2s;
  transform-box:fill-box;
}
.gate-bow .bow-left{ transform-origin:right center; }
.gate-bow .bow-right{ transform-origin:left center; }
.gate-bow .bow-tail-left{ transform-origin:right top; }
.gate-bow .bow-tail-right{ transform-origin:left top; }
.cover.is-open .gate-bow .bow-left{ transform:translateX(-112px) rotate(-18deg); }
.cover.is-open .gate-bow .bow-right{ transform:translateX(112px) rotate(18deg); }
.cover.is-open .gate-bow .bow-tail-left{ transform:translate(-92px, 72px) rotate(-12deg); }
.cover.is-open .gate-bow .bow-tail-right{ transform:translate(92px, 72px) rotate(12deg); }
.cover.is-open .gate-bow .bow-knot{ transform:scale(.72); opacity:.15; }
.gate-bow .bow-knot{ transform-origin:center; transition:transform .9s ease 1s, opacity .9s ease 1s; }

/* ---------- Ganesha at the crown of the arch --------------
   Sits OUTSIDE .gate on purpose: the doors swing away
   beneath it, the blessing over the threshold stays put.   */
.ganesha{
  position:absolute; left:50%; top:4.5%;
  translate:-50% 0;
  z-index:6;
  display:grid; justify-items:center; gap:11px;
  /* an explicit width, not max-content: a long shloka would
     otherwise outgrow the stage and get clipped by overflow  */
  width:min(340px, 86%);
  pointer-events:none;
  /* `translate` does the centring and stays put; the entrance and
     exit ride on `transform`, so they never fight each other.
     No fill-mode, so the transition below can take over once the
     entrance has finished.                                      */
  animation:settle 1.5s cubic-bezier(.2,.7,.25,1);
  transition:opacity 1.2s ease 1s, transform 1.7s ease 1s;
}
.cover .ganesha{ opacity:0; visibility:hidden; }
@keyframes settle{
  from{ opacity:0; transform:translateY(-14px); }
  to  { opacity:1; transform:none; }
}
/* the blessing lifts away rather than blinking out */
.cover.is-open .ganesha{ opacity:0; transform:translateY(-34px); }
/* a soft elliptical pool of shade so gold reads against the
   flowers — sized to the block, not a fixed circle, or a long
   verse would drag it across the whole cover                 */
.ganesha::before{
  content:''; position:absolute;
  left:50%; top:47%; translate:-50% -50%;
  width:128%; height:186%;
  background:radial-gradient(closest-side ellipse at 50% 50%,
             rgba(38,16,16,.70) 0%, rgba(38,16,16,.42) 52%, rgba(38,16,16,0) 78%);
  z-index:-1;
}
.niche{
  position:relative;
  width:clamp(66px, 19vw, 92px);
  aspect-ratio:100/116;
  filter:drop-shadow(0 3px 10px rgba(30,10,12,.55));
}
.niche svg{ position:absolute; inset:0; width:100%; height:100%; }
/* your image, clipped into the temple niche */
.niche-art{
  position:absolute; inset:0;
  clip-path:url(#nicheClip);
  background-size:cover; background-position:center 22%;
  display:grid; place-items:center;
}
.niche-art.is-glyph{
  background:radial-gradient(120% 100% at 50% 18%, rgba(255,238,205,.16), rgba(255,238,205,0) 70%);
}
/* the drawn idol is line art, so it is NOT clipped to the arch —
   its ears are meant to graze the inner edge                    */
.niche-idol{ pointer-events:none; }
.niche.has-art .niche-idol{ display:none; }
.niche.has-idol .niche-art{ display:none; }
.niche-art .om{
  font-family:var(--f-deva);
  font-size:clamp(30px,8.6vw,42px);
  line-height:1;
  margin-top:14%;
  color:var(--gold-pale);
  text-shadow:0 2px 8px rgba(30,10,12,.6);
}
.invocation{
  font-family:var(--f-deva);
  font-size:clamp(11.5px,3.1vw,13.5px);
  letter-spacing:.03em;
  line-height:1.85;
  color:var(--gold-pale);
  text-shadow:0 1px 3px rgba(30,10,12,.95), 0 2px 12px rgba(30,10,12,.8);
  margin:0; text-align:center;
  max-width:100%;
}
/* each pada of the verse is its own block, so if one has to wrap
   on a narrow phone the two halves still read as two halves    */
.invocation .line{
  display:block;
  text-wrap:balance;
  overflow-wrap:break-word;
}
/* a shorter line at the top of the hero — this one may stay on
   a single line, since it is deliberately kept brief           */
.hero-invocation{
  margin-bottom:16px;
  opacity:.92;
  font-size:clamp(12px,3.2vw,14px);
  white-space:nowrap;
}

.cover-cta{
  position:absolute; left:0; right:0; bottom:19%;
  display:flex; flex-direction:column; align-items:center; gap:10px;
  background:none; border:0; cursor:pointer; padding:16px;
  transition:opacity .5s ease;
}
.cover.is-open .cover-cta{ opacity:0; pointer-events:none; }
.cover-cta .label{
  font-family:var(--f-serif);
  font-size:clamp(21px,5.6vw,26px);
  letter-spacing:.1em;
  color:#fff8f3;
  text-shadow:0 2px 12px rgba(87,48,46,.6);
}
.cover-cta .pulse{
  width:44px; height:44px; border-radius:50%;
  border:1px solid rgba(255,248,243,.8);
  display:grid; place-items:center;
  animation:pulse 2.4s ease-in-out infinite;
}
.cover-cta .pulse svg{ width:16px; height:16px; stroke:#fff8f3; }
@keyframes pulse{
  0%,100%{ transform:scale(1);    box-shadow:0 0 0 0 rgba(239,203,134,.30); }
  70%    { transform:scale(1.04); box-shadow:0 0 0 16px rgba(239,203,134,0); }
}

/* ============================================================
   2 · NIGHT HERO
   ============================================================ */
.hero{
  position:relative;
  min-height:100vh; min-height:100dvh;
  display:grid; align-content:center;
  padding:16vh var(--pad) 12vh;
  background:var(--night);
  overflow:hidden;
  isolation:isolate;
}
.hero-photo{ position:absolute; inset:0; background-size:cover; background-position:center; }
#heroArt{ position:absolute; inset:0; width:100%; height:100%; }
.hero-scrim{
  position:absolute; inset:0;
  background:
    radial-gradient(70% 45% at 50% 30%, rgba(16,23,51,0) 0%, rgba(11,15,36,.55) 100%),
    linear-gradient(to bottom, rgba(9,13,32,.5) 0%, rgba(9,13,32,.1) 38%, rgba(9,13,32,.78) 100%);
}
.hero.has-hero-image{
  background:var(--night);
  animation:heroGround 1.1s ease forwards;
  animation-play-state:paused;
}
.hero.has-hero-image .hero-frame,
.hero.has-hero-image .scroll-cue{
  display:grid;
  bottom:calc(4.5vh + env(safe-area-inset-bottom));
  color:#5b3030;
  text-shadow:0 1px 5px rgba(255,247,241,.95);
  z-index:3;
}
.hero.has-hero-image .scroll-cue svg{ stroke:#5b3030; }
.hero.has-hero-image .hero-photo{
  background-size:cover;
  background-position:center;
  opacity:0;
  animation:heroPhotoReveal 1.15s ease .18s forwards;
  animation-play-state:paused;
}
.hero.has-hero-image .hero-scrim{
  background:
    linear-gradient(to bottom, rgba(255,247,241,.48) 0%, rgba(255,247,241,.34) 48%, rgba(72,38,38,.3) 100%);
  backdrop-filter:blur(1.5px);
}
.hero.has-hero-image .hero-inner{
  display:block;
  width:min(100%, 430px);
  margin-inline:auto;
  padding:clamp(28px, 8vh, 64px) 24px clamp(26px, 7vh, 54px);
  background:rgba(255,247,241,.34);
  border:1px solid rgba(255,255,255,.56);
  box-shadow:0 10px 34px rgba(91,58,54,.16);
  backdrop-filter:blur(4px);
  border-radius:8px;
  color:#5b3030;
  text-shadow:0 2px 10px rgba(255,247,241,.95);
}
.hero.has-hero-image .hero-inner > *{
  opacity:0;
  transform:translateY(12px);
  animation:heroLineReveal .65s cubic-bezier(.2,.7,.25,1) forwards;
  animation-play-state:paused;
}
.hero.has-hero-image .names{
  opacity:1;
  transform:none;
  animation:none;
}
.hero.has-hero-image .names > *{
  opacity:0;
  transform:translateY(12px);
  animation:heroLineReveal .65s cubic-bezier(.2,.7,.25,1) forwards;
  animation-play-state:paused;
}
.hero.has-hero-image.intro-active,
.hero.has-hero-image.intro-active .hero-photo,
.hero.has-hero-image.intro-active .hero-inner > *,
.hero.has-hero-image.intro-active .names > *{ animation-play-state:running; }
.hero.has-hero-image .hero-invocation{ animation-delay:.42s; }
.hero.has-hero-image .eyebrow{ animation-delay:.66s; }
.hero.has-hero-image .hero-heart{ animation-delay:.84s; }
.hero.has-hero-image .nameA-reveal{ animation-delay:1.02s; }
.hero.has-hero-image .parentA-reveal{ animation-delay:1.2s; }
.hero.has-hero-image .amp{ animation-delay:1.38s; }
.hero.has-hero-image .nameB-reveal{ animation-delay:1.56s; }
.hero.has-hero-image .parentB-reveal{ animation-delay:1.74s; }
@keyframes heroGround{
  from{ background:var(--night); }
  to{ background:#d9c0bc; }
}
@keyframes heroPhotoReveal{
  from{ opacity:0; transform:scale(1.035); }
  to{ opacity:1; transform:none; }
}
@keyframes heroLineReveal{
  to{ opacity:1; transform:none; }
}
.hero.has-hero-image .eyebrow{ color:#4e2727; font-weight:600; }
.hero.has-hero-image .family-invite{
  max-width:32ch;
  margin:0 auto 10px;
  font-family:var(--f-serif);
  font-size:clamp(15px,4vw,18px);
  font-style:italic;
  font-weight:500;
  line-height:1.55;
  letter-spacing:.035em;
  text-transform:none;
  text-wrap:balance;
}
.hero.has-hero-image .hero-heart{ fill:#b96e78; }
.hero.has-hero-image .name{
  color:#7e431f;
  background:none;
  -webkit-text-fill-color:#7e431f;
  filter:drop-shadow(0 2px 5px rgba(255,247,241,.95));
}
.hero.has-hero-image .parent{
  color:#4e2727;
  font-size:clamp(16px, 4.2vw, 19px);
  font-weight:600;
  line-height:1.45;
}
.hero.has-hero-image .amp{ color:#7e431f; }
.hero.has-hero-image .hero-date{ display:none; }
/* ornamental pillars framing the scene */
.hero-frame{ position:absolute; inset:0; pointer-events:none; }
.hero-frame svg{ width:100%; height:100%; }

.hero-inner{ position:relative; text-align:center; }

.eyebrow{
  font-size:clamp(13px,3.4vw,15px);
  letter-spacing:.34em; text-transform:uppercase;
  color:rgba(246,236,226,.82);
}
.hero .eyebrow{ margin-bottom:6px; }
.hero-heart{ margin:0 auto 18px; width:16px; fill:#f0c3c6; opacity:.9; }

.names{ display:grid; gap:2px; }
.name{
  font-family:var(--f-name);
  font-size:clamp(52px,15vw,74px);
  line-height:1.02;
  margin:0;
  color:var(--gold);
  background:linear-gradient(178deg,#f6dfa4 6%,#d8a441 52%,#b47c27 100%);
  -webkit-background-clip:text; background-clip:text;
  -webkit-text-fill-color:transparent;
  filter:drop-shadow(0 3px 10px rgba(0,0,0,.45));
  padding-bottom:.06em;
}
.parent{
  font-size:clamp(13px,3.5vw,15px);
  font-style:italic;
  color:rgba(246,236,226,.9);
  line-height:1.5;
  margin:2px 0 0;
  text-wrap:balance;
}
.amp{
  font-family:var(--f-name);
  font-size:clamp(34px,9vw,44px);
  color:var(--gold-pale);
  margin:10px 0 4px;
  opacity:.95;
}
.hero-date{
  margin-top:26px;
  font-size:clamp(15px,4vw,17px);
  letter-spacing:.2em; text-transform:uppercase;
  color:var(--ivory);
}
.hero-date span{ display:block; letter-spacing:.12em; text-transform:none;
  font-style:italic; font-size:.9em; opacity:.75; margin-top:5px; }

.scroll-cue{
  position:fixed; left:0; right:0;
  margin-inline:auto;
  z-index:4;
  bottom:calc(3vh + env(safe-area-inset-bottom));
  display:grid; justify-items:center; gap:8px; width:max-content;
  font-size:14px; font-weight:700; letter-spacing:.22em; text-transform:uppercase;
  color:rgba(246,236,226,.92);
  text-shadow:0 2px 8px rgba(0,0,0,.55);
  pointer-events:none;
  transition:opacity .25s ease, visibility .25s;
  animation:scrollCueJump 2.2s cubic-bezier(.45,0,.25,1) infinite;
}
.scroll-cue.is-scrolled{ opacity:0; visibility:hidden; }
.scroll-cue svg{ width:24px; height:24px; stroke:currentColor; filter:drop-shadow(0 2px 5px rgba(0,0,0,.45)); }
@keyframes scrollCueJump{
  0%,55%,100%{ transform:translateY(0); }
  68%{ transform:translateY(-11px); }
  80%{ transform:translateY(3px); }
  90%{ transform:translateY(-4px); }
}

/* ============================================================
   3 · SECTIONS on blush
   ============================================================ */
.sec{
  position:relative;
  padding:clamp(56px,13vw,82px) var(--pad);
}
.sec.tint     { background:linear-gradient(to bottom, var(--blush-soft), var(--cream)); }
.sec.tint-2   { background:var(--cream); }
.sec.tint-3   { background:linear-gradient(to bottom, var(--cream), var(--blush-soft)); }
.sec.pad-tight{ padding-top:clamp(34px,8vw,48px); }
/* soften the seam where the night sky meets the blush */
.seam{ height:70px; background:linear-gradient(to bottom, var(--night), var(--blush-soft)); }

.sec-head{ position:relative; text-align:center; margin-bottom:clamp(26px,7vw,38px); }
/* a scatter of festive confetti flecks behind each section title */
.sec-head::before{
  content:'';
  position:absolute; left:-12px; right:-12px; top:-16px; height:64px;
  background-image:
    radial-gradient(3px 3px at 8% 25%, var(--festive-pink) 99%, transparent 100%),
    radial-gradient(2.4px 2.4px at 22% 65%, var(--festive-teal) 99%, transparent 100%),
    radial-gradient(3px 3px at 40% 15%, var(--gold) 99%, transparent 100%),
    radial-gradient(2.4px 2.4px at 60% 60%, var(--festive-orange) 99%, transparent 100%),
    radial-gradient(3px 3px at 78% 25%, var(--festive-pink) 99%, transparent 100%),
    radial-gradient(2.4px 2.4px at 92% 60%, var(--gold) 99%, transparent 100%);
  opacity:.5;
  pointer-events:none;
}
.sec-head > *{ position:relative; }
.ico{ width:26px; height:26px; margin:0 auto 12px; stroke:var(--oxblood-soft); }
.script{
  font-family:var(--f-script);
  font-weight:400;
  font-size:clamp(31px,8.6vw,40px);
  line-height:1.15;
  color:var(--oxblood);
  margin:0;
  text-wrap:balance;
}
.rule{
  display:flex; align-items:center; justify-content:center; gap:12px;
  margin:14px auto 0; width:min(280px,72%);
}
.rule i{ flex:1; height:1px; background:linear-gradient(to right, transparent, var(--line), transparent); }
.rule svg{ width:9px; fill:var(--oxblood-soft); opacity:.75; flex:none; }

/* invitation note */
.note{
  text-align:center;
  font-style:italic;
  font-size:clamp(17px,4.6vw,19px);
  line-height:1.72;
  color:var(--oxblood-soft);
  max-width:34ch; margin-inline:auto;
  text-wrap:pretty;
}
.note + .note{ margin-top:16px; font-style:normal; font-size:clamp(15.5px,4.2vw,17px); color:var(--rose-ink); }

/* ---------- scratch card --------------------------------- */
.scratch-wrap{
  position:relative;
  width:min(320px, 82%);
  aspect-ratio:100/86;
  margin:6px auto 0;
  touch-action:none;
}
.scratch-outline{ position:absolute; inset:0; }
.scratch-outline path{ fill:none; stroke:var(--oxblood); stroke-width:.7; }
.scratch-face{
  position:absolute; inset:0;
  display:grid; align-content:center; justify-items:center;
  padding:22% 16% 20%;
  text-align:center;
}
.scratch-face .invited{
  font-style:italic; font-size:clamp(16px,4.4vw,18px);
  color:var(--oxblood-soft); margin-bottom:4px;
}
.scratch-face .big-date{
  font-weight:600; font-size:clamp(19px,5.2vw,23px);
  letter-spacing:.01em; color:var(--oxblood);
}
.scratch-face .sub{ font-size:14.5px; color:var(--rose-ink); margin-top:2px; }
.scratch-face .sub.time{ font-size:13px; opacity:.85; }
#scratchCanvas{
  position:absolute; inset:0; width:100%; height:100%;
  clip-path:url(#heartClip);
  cursor:grab;
  transition:opacity .7s ease;
}
#scratchCanvas.is-done{ opacity:0; pointer-events:none; }
.scratch-hint{
  text-align:center; font-size:13px; font-style:italic;
  color:var(--rose-ink); opacity:.8; margin-top:18px;
  transition:opacity .4s ease;
}
.scratch-hint.is-hidden{ opacity:0; }
#confetti{ position:fixed; inset:0; z-index:65; pointer-events:none; }

/* ---------- photo card ----------------------------------- */
.photo{
  position:relative;
  border-radius:2px;
  overflow:hidden;
  background:var(--shade);
  box-shadow:0 14px 34px rgba(107,33,28,.14);
}
.photo::after{
  content:''; position:absolute; inset:0;
  border:1px solid rgba(253,247,243,.4);
  pointer-events:none;
}
.photo img{ width:100%; height:100%; object-fit:cover; aspect-ratio:4/3; }
.photo.tall img{ aspect-ratio:3/4; }
.caption{
  text-align:center; font-style:italic; font-size:14.5px;
  color:var(--rose-ink); margin-top:12px;
}

/* ---------- countdown ------------------------------------ */
.count{
  display:grid; grid-template-columns:repeat(4,1fr);
  gap:clamp(7px,2.4vw,12px);
}
.cell{
  position:relative;
  overflow:hidden;
  background:var(--cream);
  border:1px solid var(--line-soft);
  border-radius:3px;
  padding:clamp(13px,3.6vw,18px) 4px clamp(10px,2.8vw,13px);
  text-align:center;
  box-shadow:0 3px 10px rgba(107,33,28,.05);
}
/* a thin festive accent stripe, one colour per tile */
.cell::before{ content:''; position:absolute; top:0; left:0; right:0; height:4px; }
.cell:nth-child(1)::before{ background:var(--festive-pink); }
.cell:nth-child(2)::before{ background:var(--gold); }
.cell:nth-child(3)::before{ background:var(--festive-teal); }
.cell:nth-child(4)::before{ background:var(--festive-orange); }
.cell b{
  display:block;
  font-weight:600;
  font-size:clamp(26px,7.6vw,34px);
  line-height:1;
  color:var(--oxblood);
  font-variant-numeric:tabular-nums lining-nums;
}
.cell span{
  display:block; margin-top:7px;
  font-size:10.5px; letter-spacing:.18em; text-transform:uppercase;
  color:var(--rose-ink);
}

/* ---------- zig-zag celebration timeline ---------------- */
.timeline{
  position:relative;
  display:grid;
  gap:clamp(22px,6vw,34px);
  max-width:430px;
  margin-inline:auto;
  padding:6px 0;
}
.timeline::before{
  content:'';
  position:absolute;
  top:0; bottom:0; left:50%;
  border-left:1px dashed rgba(138,65,58,.35);
  transform:translateX(-50%);
}
.tl-item{
  position:relative;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
  align-items:center;
  min-height:118px;
}
.tl-item:nth-child(even) .tl-card{ grid-column:2; }
.tl-item:nth-child(odd) .tl-card{ grid-column:1; }
/* each celebration gets its own colour, cycling through the palette */
.tl-item:nth-child(5n+1){ --event-color:var(--festive-pink); }
.tl-item:nth-child(5n+2){ --event-color:var(--gold); }
.tl-item:nth-child(5n+3){ --event-color:var(--festive-teal); }
.tl-item:nth-child(5n+4){ --event-color:var(--festive-orange); }
.tl-item:nth-child(5n+5){ --event-color:var(--festive-pink); }
.tl-dot{
  position:absolute;
  left:50%; top:50%; z-index:2;
  width:12px; height:12px;
  border:3px solid var(--cream);
  border-radius:50%;
  background:var(--event-color, var(--gold));
  box-shadow:0 0 0 3px rgba(138,65,58,.2);
  transform:translate(-50%,-50%);
}
.tl-card{
  position:relative;
  display:grid;
  grid-template-columns:72px 1fr;
  gap:12px;
  align-items:center;
  padding:10px;
  background:rgba(253,247,243,.9);
  border:1px solid var(--line-soft);
  border-radius:7px;
  box-shadow:0 7px 18px rgba(107,33,28,.1);
}
.tl-item:nth-child(odd) .tl-card{ border-right:3px solid var(--event-color); }
.tl-item:nth-child(even) .tl-card{ border-left:3px solid var(--event-color); }
.tl-card::after{
  content:'';
  position:absolute;
  top:50%; width:20px;
  border-top:1px solid rgba(138,65,58,.35);
}
.tl-item:nth-child(odd) .tl-card::after{ right:-20px; }
.tl-item:nth-child(even) .tl-card::after{ left:-20px; }
.tl-thumb{
  width:72px; aspect-ratio:1;
  border-radius:50%;
  background-size:cover;
  background-position:center;
  border:3px solid rgba(216,164,65,.5);
  box-shadow:0 2px 8px rgba(107,33,28,.16);
}
.tl-item:nth-child(1) .tl-thumb{ background-image:url('assets/mehendi.png'); }
.tl-item:nth-child(2) .tl-thumb{ background-image:url('assets/sagan.png'); }
.tl-item:nth-child(3) .tl-thumb{ background-image:url('assets/ringceremony.png'); }
.tl-item:nth-child(4) .tl-thumb{ background-image:url('assets/haldi.png'); }
.tl-item:nth-child(5) .tl-thumb{ background-image:url('assets/wedding.png'); }
.tl-item h3{
  margin:0; font-weight:600;
  font-size:clamp(16px,4.5vw,19px);
  color:var(--oxblood);
}
.tl-item p{ margin:4px 0 0; font-size:13.5px; color:var(--rose-ink); font-variant-numeric:lining-nums; line-height:1.35; }
.tl-item p.where{ font-style:italic; opacity:.9; }

/* ---------- venue ---------------------------------------- */
.venue-name{
  text-align:center; font-weight:600;
  font-size:clamp(21px,5.6vw,25px);
  color:var(--oxblood);
}
.venue-city{ text-align:center; font-size:15.5px; color:var(--rose-ink); margin-top:4px; }
.venue-addr{ text-align:center; font-size:14.5px; font-style:italic; color:var(--rose-ink); margin-top:8px; max-width:30ch; margin-inline:auto; }
.map{
  position:relative; margin-top:22px;
  aspect-ratio:5/4; border-radius:3px; overflow:hidden;
  border:1px solid var(--line-soft);
  background:#e9e3dc;
}
.map canvas, .map iframe{ width:100%; height:100%; border:0; display:block; }
.map-pill{
  position:absolute; left:12px; top:12px;
  display:inline-flex; align-items:center; gap:7px;
  padding:8px 14px; border-radius:999px;
  background:rgba(253,247,243,.93);
  border:1px solid var(--line-soft);
  box-shadow:0 3px 12px rgba(60,20,20,.16);
  font-size:13.5px; color:var(--oxblood);
  text-decoration:none;
}
.map-pill svg{ width:13px; stroke:var(--oxblood); }
.map-pill:hover{ background:var(--cream); }

/* ---------- simple info list ----------------------------- */
.info{ display:grid; gap:20px; max-width:32ch; margin-inline:auto; }
.info-row h3{ margin:0 0 3px; font-weight:600; font-size:17px; color:var(--oxblood); }
.info-row p{ margin:0; font-size:15px; color:var(--rose-ink); }
.body-line{
  text-align:center; font-size:clamp(15.5px,4.2vw,17px);
  color:var(--rose-ink); max-width:32ch; margin-inline:auto;
  text-wrap:pretty;
}
.transport-list{ display:grid; gap:18px; max-width:34ch; margin-inline:auto; }
.transport-row{ margin:0; color:var(--rose-ink); font-size:clamp(15.5px,4.2vw,17px); line-height:1.65; }
.transport-row strong{ color:var(--oxblood); font-weight:600; }

/* ---------- RSVP form ------------------------------------ */
.form{ display:grid; gap:17px; max-width:34ch; margin-inline:auto; }
.field{ display:grid; gap:6px; }
.field > label{
  font-size:12.5px; letter-spacing:.12em; text-transform:uppercase;
  color:var(--oxblood-soft);
}
.field .req{ color:var(--gold); }
.field input,.field select,.field textarea{
  font-family:var(--f-serif); font-size:16px;
  color:var(--oxblood);
  background:var(--cream);
  border:0; border-bottom:1px solid var(--line);
  border-radius:0;
  padding:9px 2px;
  width:100%;
  appearance:none;
}
.field textarea{ resize:vertical; min-height:74px; line-height:1.55; }
.field input::placeholder,.field textarea::placeholder{ color:rgba(138,95,89,.6); font-style:italic; }
.field input:focus,.field select:focus,.field textarea:focus{
  outline:none; border-bottom-color:var(--gold);
}
.select-wrap{ position:relative; }
.select-wrap svg{
  position:absolute; right:4px; top:50%; translate:0 -50%;
  width:13px; stroke:var(--oxblood-soft); pointer-events:none;
}
.submit{
  margin-top:6px; padding:15px;
  background:linear-gradient(135deg, var(--oxblood) 0%, var(--festive-pink) 100%);
  color:var(--ivory);
  border:0; border-radius:2px; cursor:pointer;
  font-size:15px; letter-spacing:.1em;
  transition:background .25s ease, transform .12s ease;
}
.submit:hover{ background:linear-gradient(135deg, #571812 0%, #a52d5e 100%); }
.submit:active{ transform:translateY(1px); }
.form-note{ font-size:13px; font-style:italic; color:var(--rose-ink); text-align:center; opacity:.8; }
.thanks{
  display:none; text-align:center;
  padding:30px 10px;
}
.thanks.is-on{ display:block; }
.thanks .script{ font-size:clamp(28px,7.4vw,34px); }
.thanks p{ margin:10px 0 0; color:var(--rose-ink); font-size:15.5px; }
.form.is-off{ display:none; }

/* ---------- closing -------------------------------------- */
.closing{
  position:relative;
  overflow:hidden;
  padding:clamp(60px,15vw,88px) var(--pad) clamp(72px,17vw,100px);
  background:linear-gradient(to bottom, var(--blush-soft), var(--blush));
  text-align:center;
}
/* a light scatter of festive confetti behind the closing message */
.closing::before{
  content:'';
  position:absolute; inset:0;
  background-image:
    radial-gradient(3px 3px at 10% 15%, var(--festive-pink) 99%, transparent 100%),
    radial-gradient(2.6px 2.6px at 25% 72%, var(--gold) 99%, transparent 100%),
    radial-gradient(3px 3px at 45% 30%, var(--festive-teal) 99%, transparent 100%),
    radial-gradient(2.4px 2.4px at 62% 82%, var(--festive-orange) 99%, transparent 100%),
    radial-gradient(3px 3px at 80% 20%, var(--festive-pink) 99%, transparent 100%),
    radial-gradient(2.6px 2.6px at 92% 65%, var(--gold) 99%, transparent 100%),
    radial-gradient(2.4px 2.4px at 15% 90%, var(--festive-teal) 99%, transparent 100%),
    radial-gradient(3px 3px at 70% 55%, var(--festive-orange) 99%, transparent 100%);
  opacity:.32;
  pointer-events:none;
}
.closing > *{ position:relative; }
.closing .script{ font-size:clamp(30px,8.2vw,38px); max-width:22ch; margin-inline:auto; }
.closing .signature{
  font-family:var(--f-name);
  font-size:clamp(30px,8vw,38px);
  color:var(--oxblood-soft);
  margin-top:22px;
}
.closing .tag{
  margin-top:16px; font-size:clamp(20px,5.6vw,26px); letter-spacing:.02em;
  font-family:var(--f-name); text-transform:none; color:var(--rose-ink); opacity:.9;
}
.closing .tag b{ font-weight:700; color:var(--oxblood-soft); }

/* ============================================================
   4 · FLOATING CONTROLS
   ============================================================ */
.ctl{
  position:fixed; z-index:80;
  display:inline-flex; align-items:center; gap:7px;
  padding:9px 13px; border-radius:999px;
  background:rgba(253,247,243,.9);
  border:1px solid rgba(107,33,28,.14);
  box-shadow:0 4px 16px rgba(60,20,20,.18);
  backdrop-filter:blur(8px);
  font-size:13px; color:var(--oxblood);
  cursor:pointer;
  transition:opacity .8s ease, background .25s ease;
}
.ctl:hover{ background:var(--cream); }
.ctl svg{ width:15px; height:15px; flex:none; stroke:var(--oxblood); }
#musicBtn{ top:calc(14px + env(safe-area-inset-top)); right:14px; padding:10px; }
#musicBtn .off{ display:none; }
#musicBtn.is-muted .on{ display:none; }
#musicBtn.is-muted .off{ display:block; }
#langBtn{ bottom:calc(16px + env(safe-area-inset-bottom)); left:14px; }
#langLabel{ font-family:var(--f-any); }
.ctl.is-hidden{ opacity:0; pointer-events:none; }

/* desktop: keep the controls hugging the column */
@media (min-width:600px){
  #musicBtn{ right:calc(50vw - var(--col)/2 + 14px); }
  #langBtn{ left:calc(50vw - var(--col)/2 + 14px); }
}

/* ============================================================
   5 · REVEAL ON SCROLL
   ============================================================ */
.reveal{
  opacity:0; transform:translateY(20px);
  transition:opacity .85s cubic-bezier(.2,.7,.25,1), transform .85s cubic-bezier(.2,.7,.25,1);
  transition-delay:var(--d,0ms);
}
.reveal.in{ opacity:1; transform:none; }

/* ============================================================
   6 · INDIC SCRIPTS — Great Vibes, Parisienne and EB Garamond
   carry no Devanagari or Bengali at all, so Hindi and Bangla
   swap the display faces out and rebalance the sizes. The
   `indic` class is set alongside lang="…" by applyLang().
   ============================================================ */
html[lang="hi"]{ --f-indic:var(--f-deva);   }
html[lang="bn"]{ --f-indic:var(--f-bangla); }

html.indic body,
html.indic .field input,
html.indic .field select,
html.indic .field textarea{ font-family:var(--f-indic); }
html.indic .script{
  font-family:var(--f-indic); font-style:italic;
  font-size:clamp(24px,6.4vw,30px); line-height:1.4;
}
html.indic .name{
  font-family:var(--f-indic); font-style:normal;
  font-size:clamp(38px,11vw,52px); line-height:1.3;
  padding-bottom:0;
}
html.indic .amp,
html.indic .signature{ font-family:var(--f-indic); }
html.indic .signature{ font-size:clamp(23px,6vw,28px); }
html.indic .note{ font-style:normal; line-height:1.9; }
html.indic .cell span,
html.indic .field > label{ letter-spacing:.04em; }
html.indic .eyebrow,
html.indic .hero-date{ letter-spacing:.12em; }
html.indic .hero.has-hero-image .family-invite{
  font-family:var(--f-indic);
  font-style:normal;
  letter-spacing:.04em;
}
/* Bengali sits a touch larger on the same optical line */
html[lang="bn"] .script{ font-size:clamp(23px,6.1vw,29px); }
html[lang="bn"] .invocation{ font-family:var(--f-bangla); }

@media (prefers-reduced-motion:reduce){
  *{ animation-duration:.001ms !important; animation-iteration-count:1 !important; }
  .reveal{ opacity:1; transform:none; transition:none; }
  .scroll-cue{ animation:none; }
  .cover.has-cover-video .cover-photo{ animation:none; }
  /* the same sequence, collapsed to about half a second —
     OPEN_MS in the script matches this branch too */
  .gate-half{ transition-duration:.4s; transition-delay:0s; }
  .cover{ transition:opacity .3s ease .4s, visibility .3s ease .4s; }
  .cover-stage{ transition:none; }
  .cover.is-open .cover-stage{ transform:none; }
  .cover-photo, #coverArt, .cover-vignette{ transition-duration:.3s; transition-delay:.1s; }
  .ganesha{ transition-duration:.3s; transition-delay:.1s; }
  .gate-bow{ transition-duration:.3s; transition-delay:0s; }
}
</style>

<!-- heart clip used by the scratch canvas -->

  <clipPath id="heartClip" clipPathUnits="objectBoundingBox">
    <path transform="scale(0.01,0.0116279)"

  </clipPath>
  <!-- the temple niche that holds the Ganesha image -->
  <clipPath id="nicheClip" clipPathUnits="objectBoundingBox">
    <path transform="scale(0.01,0.00862069)"
          d="M15,110 V49 C15,27 31,11 50,11 C69,11 85,27 85,49 V110 Z"/>
  </clipPath>
</svg>

<!-- ============================================================
     GATE COVER
     ============================================================ -->

        <video class="cover-video" id="coverVideo" hidden muted playsinline preload="auto"
          aria-label="Wedding invitation opening video"></video>

        <svg class="niche-frame" id="nicheFrame" viewBox="0 0 100 116" aria-hidden="true"></svg>
        <div class="niche-art is-glyph" id="nicheArt" role="img"></div>
        <svg class="niche-idol" id="nicheIdol" viewBox="0 0 100 116" aria-hidden="true"></svg>
      </div>
      <p class="invocation" id="coverInvocation"></p>

      <span class="label" data-i18n="tapToOpen">tap to open</span>
      <span class="pulse" data-ico="chevronDown"></span>

</div>

<canvas id="confetti" aria-hidden="true"></canvas>

<button class="ctl is-hidden" id="musicBtn" type="button" aria-label="Toggle music">
  <span class="on"  data-ico="volumeOn"></span>
  <span class="off" data-ico="volumeOff"></span>
</button>

  <span data-ico="globe"></span><span id="langLabel">हिन्दी</span>

/* Write one or many lines into a node, each as its own block so a
   line that must wrap stays visually grouped. Text nodes rather
   than innerHTML — no markup, nothing to escape.               */
function setLines(node, value){
  if (!node) return '';
  const lines = (Array.isArray(value) ? value : [value]).filter(s => s !== '' && s != null);
  node.textContent = '';
  lines.forEach(line => {
    const span = document.createElement('span');
    span.className = 'line';
    span.textContent = line;
    node.appendChild(span);
  });
  node.hidden = !lines.length;
  return lines.join(' ');
}

/* ================================================================
   Canvas art — the gate, the night sky, the little maps
   ================================================================ */
function fitCanvas(cv){
  const dpr = Math.min(devicePixelRatio || 1, 2);
  const r = cv.getBoundingClientRect();
  const w = Math.max(1, Math.round(r.width)), h = Math.max(1, Math.round(r.height));
  cv.width = w * dpr; cv.height = h * dpr;
  const ctx = cv.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return { ctx, w, h };
}

/* --- cover backdrop: a floral arch over warm light ------------- */
function drawCoverArt(){
  const cv = $('#coverArt'); if (!cv) return;
  const { ctx, w, h } = fitCanvas(cv);

  const warm = ctx.createLinearGradient(0, 0, 0, h);
  warm.addColorStop(0,   '#bba19d');
  warm.addColorStop(.34, '#d9c0bc');
  warm.addColorStop(.68, '#efd9d1');
  warm.addColorStop(1,   '#b98d88');
  ctx.fillStyle = warm; ctx.fillRect(0, 0, w, h);

  /* The reference is an architectural floral aisle: layered arches,
     a glowing curtain, and a pale path leading to the bow. */
  ctx.fillStyle = 'rgba(255,247,241,.42)';
  ctx.fillRect(w * .24, h * .11, w * .52, h * .55);
  ctx.strokeStyle = 'rgba(255,248,243,.72)';
  ctx.lineWidth = Math.max(8, w * .018);
  [
    [w * .12, h * .05, w * .88, h * .92],
    [w * .23, h * .12, w * .77, h * .72],
    [w * .34, h * .19, w * .66, h * .61]
  ].forEach(([x1, y1, x2, y2]) => {
    ctx.beginPath();
    ctx.moveTo(x1, y2);
    ctx.lineTo(x1, h * .27);
    ctx.quadraticCurveTo(w * .5, y1, x2, h * .27);
    ctx.lineTo(x2, y2);
    ctx.stroke();
  });
  for (let i = 0; i < 38; i++) {
    const x = w * .29 + i * w * .011;
    const glow = ctx.createLinearGradient(x, h * .18, x, h * .67);
    glow.addColorStop(0, 'rgba(255,255,250,.02)');
    glow.addColorStop(.45, 'rgba(255,255,250,.5)');
    glow.addColorStop(1, 'rgba(255,255,250,0)');
    ctx.strokeStyle = glow; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(x, h * .2); ctx.lineTo(x, h * .67); ctx.stroke();
  }
  ctx.fillStyle = 'rgba(255,246,236,.78)';
  ctx.beginPath();
  ctx.moveTo(w * .43, h); ctx.lineTo(w * .57, h);
  ctx.lineTo(w * .54, h * .55); ctx.lineTo(w * .46, h * .55); ctx.closePath(); ctx.fill();

  /* bokeh behind the gate */
  for (let i = 0; i < 70; i++){
    const x = ((i * 97) % 100) / 100 * w;
    const y = h * .18 + ((i * 61) % 100) / 100 * h * .7;
    const r = 2 + ((i * 37) % 9);
    const g = ctx.createRadialGradient(x, y, 0, x, y, r * 3.4);
    g.addColorStop(0, 'rgba(255,213,125,.62)');
    g.addColorStop(1, 'rgba(255,213,125,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(x, y, r * 3.4, 0, 6.284); ctx.fill();
  }

  /* the floral arch: clustered blush roses along a shallow curve */
  const rose = (x, y, r, tint) => {
    for (let k = 0; k < 5; k++){
      const a = k / 5 * 6.284 + (x % 3);
      ctx.fillStyle = tint[k % tint.length];
      ctx.beginPath();
      ctx.ellipse(x + Math.cos(a) * r * .55, y + Math.sin(a) * r * .55, r * .62, r * .52, a, 0, 6.284);
      ctx.fill();
    }
    ctx.fillStyle = 'rgba(255,250,244,.9)';
    ctx.beginPath(); ctx.arc(x, y, r * .3, 0, 6.284); ctx.fill();
  };
  const tints = ['#f4d5d0','#e9bfc0','#d8a4a7','#fff2eb','#c88d92'];
  const leaf  = ['#72705a','#59604d','#858267'];

  for (let i = 0; i < 190; i++){
    const tx = i / 189;
    const x  = tx * w;
    const band = h * .16 + Math.sin(Math.PI * tx) * -h * .045;
    const y  = band + ((i * 53) % 100) / 100 * h * .17;
    if (((i * 29) % 7) < 2){
      ctx.fillStyle = leaf[i % 3];
      ctx.beginPath();
      ctx.ellipse(x, y, 9, 3.4, (i % 5) - 2, 0, 6.284); ctx.fill();
    } else {
      rose(x, y, 7 + ((i * 41) % 8), tints);
    }
  }
  /* hanging strands of tiny blossoms */
  for (let s = 0; s < 26; s++){
    const x0 = (s + .5) / 26 * w + ((s * 17) % 11) - 5;
    const len = h * (.10 + ((s * 23) % 17) / 100);
    for (let j = 0; j < len / 11; j++){
      const y = h * .26 + j * 11;
      ctx.fillStyle = j % 3 ? 'rgba(255,240,235,.86)' : 'rgba(232,193,192,.82)';
      ctx.beginPath(); ctx.arc(x0 + Math.sin(j * .8) * 3, y, 3.1, 0, 6.284); ctx.fill();
    }
  }
  /* polished floor */
  const floor = ctx.createLinearGradient(0, h * .82, 0, h);
  floor.addColorStop(0, 'rgba(126,78,75,.08)');
  floor.addColorStop(1, 'rgba(92,50,51,.38)');
  ctx.fillStyle = floor; ctx.fillRect(0, h * .82, w, h * .18);
}

/* --- the ornate gate halves (SVG so they stay crisp while swinging) */

  const scroll = (x, y, s, flip) => `

      <path d="M0 0 C -3 8 3 15 10 13"/>

  let ornament = '';

/* --- the night hero: moon, palace, fairy lights --------------- */
let heroRAF = 0;
function drawHeroArt(){
  const cv = $('#heroArt'); if (!cv) return;
  const { ctx, w, h } = fitCanvas(cv);

  const stars = Array.from({ length: 130 }, (_, i) => ({
    x: ((i * 73) % 997) / 997 * w,
    y: ((i * 149) % 613) / 613 * h * .62,
    r: .5 + ((i * 31) % 13) / 13 * 1.1,
    p: ((i * 17) % 100) / 100 * 6.284
  }));
  const flakes = Array.from({ length: 46 }, (_, i) => ({
    x: ((i * 197) % 811) / 811 * w,
    y: ((i * 89)  % 733) / 733 * h,
    r: .7 + ((i * 41) % 10) / 10 * 1.5,
    s: .12 + ((i * 23) % 10) / 10 * .3,
    d: ((i * 53) % 100) / 100 * 6.284
  }));

  const moonX = w * .5, moonY = h * .27, moonR = Math.min(w, h) * .135;

  function frame(ms){
    const tt = ms / 1000;

    /* sky */
    const sky = ctx.createLinearGradient(0, 0, 0, h);
    sky.addColorStop(0,   '#080c22');
    sky.addColorStop(.34, '#151d40');
    sky.addColorStop(.60, '#2b2a52');
    sky.addColorStop(.80, '#4a3350');
    sky.addColorStop(1,   '#1b1730');
    ctx.fillStyle = sky; ctx.fillRect(0, 0, w, h);

    /* stars */
    stars.forEach(s => {
      const a = .35 + .45 * (.5 + .5 * Math.sin(tt * 1.1 + s.p));
      ctx.fillStyle = `rgba(233,235,255,${a})`;
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.284); ctx.fill();
    });

    /* moon halo + disc */
    const halo = ctx.createRadialGradient(moonX, moonY, moonR * .8, moonX, moonY, moonR * 3.6);
    halo.addColorStop(0, 'rgba(226,231,255,.30)');
    halo.addColorStop(1, 'rgba(226,231,255,0)');
    ctx.fillStyle = halo;
    ctx.beginPath(); ctx.arc(moonX, moonY, moonR * 3.6, 0, 6.284); ctx.fill();

    const disc = ctx.createRadialGradient(moonX - moonR * .3, moonY - moonR * .35, moonR * .1,
                                          moonX, moonY, moonR);
    disc.addColorStop(0,  '#fbfaf6');
    disc.addColorStop(.7, '#e6e4dd');
    disc.addColorStop(1,  '#c9c8c4');
    ctx.fillStyle = disc;
    ctx.beginPath(); ctx.arc(moonX, moonY, moonR, 0, 6.284); ctx.fill();
    ctx.save();
    ctx.beginPath(); ctx.arc(moonX, moonY, moonR, 0, 6.284); ctx.clip();
    ctx.fillStyle = 'rgba(160,158,158,.22)';
    [[-.32,-.18,.22],[.24,.06,.16],[-.06,.34,.19],[.34,-.36,.11],[-.44,.16,.09]]
      .forEach(([dx, dy, rr]) => {
        ctx.beginPath();
        ctx.arc(moonX + dx * moonR, moonY + dy * moonR, rr * moonR, 0, 6.284);
        ctx.fill();
      });
    ctx.restore();

    /* palace silhouette with lit windows */
    const base = h * .70;
    ctx.fillStyle = '#120f26';
    ctx.beginPath(); ctx.moveTo(0, base);
    const towers = [
      [.10,.09],[.20,.15],[.30,.11],[.40,.20],[.50,.26],
      [.60,.20],[.70,.11],[.80,.15],[.90,.09]
    ];
    towers.forEach(([tx, th]) => {
      const x = tx * w, tw = w * .052, top = base - h * th;
      ctx.lineTo(x - tw, base); ctx.lineTo(x - tw, top + h * .022);
      ctx.quadraticCurveTo(x, top - h * .026, x + tw, top + h * .022);
      ctx.lineTo(x + tw, base);
    });
    ctx.lineTo(w, base); ctx.lineTo(w, h); ctx.lineTo(0, h); ctx.closePath(); ctx.fill();

    towers.forEach(([tx, th], i) => {
      for (let k = 0; k < 3; k++){
        const x = tx * w + (k - 1) * w * .020;
        const y = base - h * th * (.30 + k * .16) + h * .05;
        const a = .5 + .4 * Math.sin(tt * .7 + i * 1.7 + k);
        ctx.fillStyle = `rgba(255,206,126,${a * .85})`;
        ctx.fillRect(x - 1.5, y, 3, 6);
      }
    });

    /* water and its shimmer */
    const water = ctx.createLinearGradient(0, base, 0, h);
    water.addColorStop(0, 'rgba(120,96,132,.5)');
    water.addColorStop(1, 'rgba(24,20,42,.9)');
    ctx.fillStyle = water; ctx.fillRect(0, base, w, h - base);
    for (let i = 0; i < 26; i++){
      const y = base + (i / 26) * (h - base);
      const a = .16 * (1 - i / 26);
      ctx.strokeStyle = `rgba(226,231,255,${a})`;
      ctx.lineWidth = 1;
      ctx.beginPath();
      const off = Math.sin(tt * .9 + i * .6) * w * .05;
      ctx.moveTo(moonX - w * .12 + off, y); ctx.lineTo(moonX + w * .12 + off, y);
      ctx.stroke();
    }

    /* fairy-light garland strung across the top */
    for (let g = 0; g < 2; g++){
      const sag = h * (.052 + g * .028), y0 = h * (.035 + g * .045);
      ctx.strokeStyle = 'rgba(232,214,196,.22)'; ctx.lineWidth = 1;
      ctx.beginPath();
      for (let p = 0; p <= 60; p++){
        const tx = p / 60, x = tx * w, y = y0 + Math.sin(Math.PI * tx) * sag;
        p ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
      }
      ctx.stroke();
      for (let p = 0; p <= 22; p++){
        const tx = p / 22, x = tx * w, y = y0 + Math.sin(Math.PI * tx) * sag;
        const a = .45 + .4 * Math.sin(tt * 1.5 + p * .9 + g);
        const gl = ctx.createRadialGradient(x, y, 0, x, y, 7);
        gl.addColorStop(0, `rgba(255,214,150,${a})`);
        gl.addColorStop(1, 'rgba(255,214,150,0)');
        ctx.fillStyle = gl; ctx.beginPath(); ctx.arc(x, y, 7, 0, 6.284); ctx.fill();
        ctx.fillStyle = `rgba(255,244,224,${a})`;
        ctx.beginPath(); ctx.arc(x, y, 1.5, 0, 6.284); ctx.fill();
      }
    }

    /* drifting sparkle */
    flakes.forEach(f => {
      f.y += f.s; if (f.y > h) { f.y = -4; }
      const x = f.x + Math.sin(tt * .5 + f.d) * 9;
      ctx.fillStyle = 'rgba(255,246,232,.5)';
      ctx.beginPath(); ctx.arc(x, f.y, f.r, 0, 6.284); ctx.fill();
    });

    if (!reduceMotion) heroRAF = requestAnimationFrame(frame);
  }
  cancelAnimationFrame(heroRAF);
  frame(reduceMotion ? 1400 : performance.now());
}

/* --- a quiet stylised street map ----------------------------- */
function drawMiniMap(cv, seed){
  const { ctx, w, h } = fitCanvas(cv);
  let s = seed * 9301 + 49297;
  const rnd = () => (s = (s * 9301 + 49297) % 233280) / 233280;

  ctx.fillStyle = '#f1ebe4'; ctx.fillRect(0, 0, w, h);

  /* water */
  ctx.fillStyle = '#cfdfe0';
  ctx.beginPath();
  ctx.moveTo(0, h * (.55 + rnd() * .2));
  ctx.quadraticCurveTo(w * .3, h * (.42 + rnd() * .2), w * .18, h);
  ctx.lineTo(0, h); ctx.closePath(); ctx.fill();

  /* blocks */
  for (let i = 0; i < 42; i++){
    const x = rnd() * w, y = rnd() * h;
    const bw = 14 + rnd() * 46, bh = 12 + rnd() * 38;
    ctx.fillStyle = rnd() > .78 ? '#e2ecdc' : '#e7dfd6';
    ctx.fillRect(x, y, bw, bh);
  }
  /* roads */
  const road = (pts, wid, col) => {
    ctx.strokeStyle = col; ctx.lineWidth = wid; ctx.lineCap = 'round';
    ctx.beginPath(); pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y));
    ctx.stroke();
  };
  for (let i = 0; i < 6; i++){
    const y = h * (.12 + i * .16 + rnd() * .04);
    road([[0, y], [w * .45, y + (rnd() - .5) * 22], [w, y + (rnd() - .5) * 30]], 2.2, '#ffffff');
  }
  for (let i = 0; i < 5; i++){
    const x = w * (.14 + i * .2 + rnd() * .05);
    road([[x, 0], [x + (rnd() - .5) * 20, h * .5], [x + (rnd() - .5) * 30, h]], 2, '#ffffff');
  }
  road([[w * .06, 0], [w * .34, h * .46], [w * .3, h]], 5.6, '#f6d98f');
  road([[0, h * .34], [w * .5, h * .3], [w, h * .44]], 4.4, '#f6d98f');

  /* the pin */
  const px = w * .5, py = h * .46;
  ctx.fillStyle = 'rgba(107,33,28,.16)';
  ctx.beginPath(); ctx.ellipse(px, py + 15, 11, 4, 0, 0, 6.284); ctx.fill();
  ctx.fillStyle = '#6b211c';
  ctx.beginPath();
  ctx.arc(px, py, 10, Math.PI * .82, Math.PI * .18);
  ctx.lineTo(px, py + 19); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#f3dcda';
  ctx.beginPath(); ctx.arc(px, py - 1, 3.7, 0, 6.284); ctx.fill();

  /* paper tint so it sits with the palette */
  ctx.fillStyle = 'rgba(233,196,196,.16)'; ctx.fillRect(0, 0, w, h);
}

/* ================================================================
   Content rendering
   ================================================================ */
function highlightSubstrings(str, subs){
  let out = str;
  subs.forEach(sub => {
    const i = out.indexOf(sub);
    if (i === -1) return;
    out = out.slice(0, i) + '<b>' + sub + '</b>' + out.slice(i + sub.length);
  });
  return out;
}

function renderStatic(){
  const c = CONFIG.couple;
  $('#nameA').textContent   = v(c.a.name);
  $('#nameB').textContent   = v(c.b.name);
  $('#parentA').textContent = v(c.a.parents);
  $('#parentB').textContent = v(c.b.parents);
  $('#signature').textContent = v(c.familySignature);
  $('#hashtag').innerHTML = highlightSubstrings(c.hashtag || '', c.hashtagEmphasis || []);

  const loc  = LOCALES[LANG] || 'en-IN';
  const long = WEDDING.toLocaleDateString(loc, { day:'numeric', month:'long', year:'numeric' });
  const day  = WEDDING.toLocaleDateString(loc, { weekday:'long' });
  const time = WEDDING.toLocaleTimeString(loc, { hour:'numeric', minute:'2-digit' });
  const monthYear = WEDDING.toLocaleDateString(loc, { month:'long', year:'numeric' });

  /* The hero deliberately stops at the month: the scratch card below
     is where the exact day, time and weekday arrive, so the reveal
     is actually revealing something. The countdown then restates it
     in plain text, which is what keeps the precise date reachable
     for anyone who never scratches. Put `long` back here and the
     scratch becomes a formality again.                            */
  $('#heroDate').innerHTML = `${monthYear}<span>${v(CONFIG.venues[0].city)}</span>`;
  $('#revealDate').textContent = long;
  $('#revealDay').textContent  = day;
  $('#revealTime').textContent = time;

  /* the shloka under the niche, a shorter line atop the hero */
  const spoken = setLines($('#coverInvocation'), CONFIG.invocation ? v(CONFIG.invocation) : '');
  setLines($('#heroInvocation'), CONFIG.heroInvocation ? v(CONFIG.heroInvocation) : '');
  const art = $('#nicheArt');
  if (art) art.setAttribute('aria-label', spoken || 'Shree Ganesha');

  const transport = $('#transportText');
  transport.textContent = '';
  v(CONFIG.transport).forEach(item => {
    const row = el('p', 'transport-row');
    const label = el('strong');
    label.textContent = item.label + ' ';
    row.appendChild(label);

    let remaining = item.text;
    (item.emphasis || []).forEach(part => {
      const index = remaining.indexOf(part);
      if (index < 0) return;
      row.append(document.createTextNode(remaining.slice(0, index)));
      const strong = el('strong');
      strong.textContent = part;
      row.appendChild(strong);
      remaining = remaining.slice(index + part.length);
    });
    row.append(document.createTextNode(remaining));
    transport.appendChild(row);
  });

  $('#formNote').textContent      = v(CONFIG.rsvpBy);

  /* countdown footnote doubles as the calendar link */
  const note = $('#countdownNote');
  note.innerHTML = '';
  const a = el('a', 'map-pill');
  a.style.position = 'static';
  a.href = calendarUrl();
  a.target = '_blank'; a.rel = 'noopener';
  a.innerHTML = `<span data-ico="sparkle"></span><span>${t('addToCal')}</span>`;
  note.appendChild(a);
  paintIcons(note);
}

function calendarUrl(){
  const pad = n => String(n).padStart(2, '0');
  const z = d => d.getUTCFullYear() + pad(d.getUTCMonth() + 1) + pad(d.getUTCDate())
              + 'T' + pad(d.getUTCHours()) + pad(d.getUTCMinutes()) + '00Z';
  const end = new Date(WEDDING.getTime() + 4 * 3600e3);
  const q = new URLSearchParams({
    action:'TEMPLATE',
    text:`${v(CONFIG.couple.a.name)} & ${v(CONFIG.couple.b.name)} — Wedding`,
    dates:`${z(WEDDING)}/${z(end)}`,
    location:`${v(CONFIG.venues[0].name)}, ${v(CONFIG.venues[0].city)}`,
    details:CONFIG.couple.hashtag || ''
  });
  return 'https://calendar.google.com/calendar/render?' + q;
}

function renderTimeline(){
  const box = $('#timeline'); box.innerHTML = '';
  CONFIG.timeline.forEach((e, i) => {
    const row = el('div', 'tl-item reveal');
    row.style.setProperty('--d', `${i * 90}ms`);

      `<span class="tl-dot"></span>
       <div class="tl-card">
        <span class="tl-thumb" aria-hidden="true"></span>
        <div>
         <h3>${v(e.title)}</h3>
         <p>${v(e.when)}</p>
        </div>
       </div>`;
    box.appendChild(row);
  });
}

function renderVenues(){
  const box = $('#venues'); box.innerHTML = '';
  CONFIG.venues.forEach((ven, i) => {
    const sec = el('section', `sec ${i % 2 ? 'tint' : 'tint-3'}`);
    const mapInner = ven.embed
      ? `<iframe src="${ven.embed}" loading="lazy" title="${v(ven.name)}"
                 referrerpolicy="no-referrer-when-downgrade" allowfullscreen></iframe>`
      : `<canvas class="mini-map" data-seed="${i + 3}"></canvas>`;
    sec.innerHTML = `
      <div class="sec-head reveal">
        <svg class="ico" data-ico="pin" aria-hidden="true"></svg>
        <h2 class="script">${v(ven.label)}</h2>
        <div class="rule" aria-hidden="true"></div>
      </div>
      <p class="venue-name reveal" style="--d:80ms">${v(ven.name)}</p>
      <p class="venue-city reveal" style="--d:120ms">${v(ven.city)}</p>
      <p class="venue-addr reveal" style="--d:160ms">${v(ven.addr)}</p>
      <div class="map reveal" style="--d:220ms">

        <a class="map-pill" target="_blank" rel="noopener"
           href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(ven.maps || v(ven.name))}">
          <span data-ico="arrowOut"></span><span>${t('openInMaps')}</span>
